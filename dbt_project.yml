# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "data_engineering"
version: "1.0.0"
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: "default"

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros", "materializations"]
snapshot-paths: ["snapshots"]

target-path: "target" # directory which will store compiled SQL files
clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Needed for package: get-select/dbt_snowflake_query_tags
# https://github.com/get-select/dbt-snowflake-query-tags
dispatch:
  - macro_namespace: dbt
    search_order:
      - data_engineering
      - dbt_snowflake_query_tags
      - dbt
query-comment:
  comment: '{{ dbt_snowflake_query_tags.get_query_comment(node, extra={"run_started_at": builtins.run_started_at | string }) }}'
  append: true # Snowflake removes prefixed comments.

vars:
  dbt_date:time_zone: "America/Chicago"
  lookback: 3
  offset: 0
  dev_day_filter: 7
  incremental_mode: lookback
  lookback_custodial: 14
  disable_run_results: "{{ target.name not in ['prod', 'test'] }}"
  disable_tests_results: "{{ target.name not in ['prod', 'test'] }}"
  disable_dbt_invocation_autoupload: "{{ target.name not in ['prod', 'test'] }}"
  disable_dbt_artifacts_autoupload: "{{ target.name not in ['prod', 'test'] }}"
  fivetran_platform_database: fivetran # default is your target.database
  fivetran_platform_schema: fivetran_log # default is fivetran_log
  fivetran_platform_using_destination_membership: false # this will disable only the destination membership logic
  github_source:
    github_database: fivetran
    github_schema: github

  # [Policies]
  use_common_policy_db: "True"
  common_policy_db: |
      {%- if  target.name in ["dev", "ci"] -%} {{ target.database }}
      {%- elif target.name == "test" -%} {{ target.database }} || _test
      {%- else -%} {{ target.database }}
      {%- endif -%}
  common_policy_schema: |
      {%- if  target.name in ["dev", "ci"] -%} {{ target.schema }}
      {%- else -%} policies
      {%- endif -%}
  common_tag_database: |
      {%- if  target.name in ["dev", "ci"] -%} {{ target.database }}
      {%- elif target.name == "test" -%} {{ target.database }} || _test
      {%- else -%} {{ target.database }}
      {%- endif -%}
  common_tag_schema: |
      {%- if  target.name in ["dev", "ci"] -%} {{ target.schema }}
      {%- else -%} tags
      {%- endif -%}

on-run-start:
  - "{{ create_schemas() if target.name in ['prod', 'test', 'ci'] }}"
  - "{{ has_children_in_scope(model_name='pershing_udfs', macro_name='create_pershing_udfs') }}"
  - "{{ create_row_access_policies() }}"
  - "{{ create_masking_policies() }}"
on-run-end:
  - "{{ grant_usage_on_schemas_where_select() if target.name in ['prod', 'test'] }}"
  - "{% if target.name in ['prod', 'test'] %}{{ dbt_artifacts.upload_results(results) }}{% endif %}"

data_tests:
  +store_failures: true
  +limit: 500

# [Configuring models]
# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:
  github_source:
    +tags: ["github", "daily"]
    +grants:
      select: "{{ ['engineering', 'datamanagement'] if target.name in ['prod', 'test', 'ci'] else []}}"
    +database: |
      {%- if  target.name == "dev" -%} datalake_dev
      {%- elif target.name == "prod"  -%} datalake
      {%- elif target.name == "test"  -%} datalake_dev
      {%- else -%} datalake_dev
      {%- endif -%}
    +schema: github # leave blank for just the target_schema
  github:
    +tags: ["github", "daily"]
    +grants:
      select: "{{ ['engineering', 'datamanagement'] if target.name in ['prod', 'test', 'ci'] else []}}"
    +database: |
      {%- if  target.name == "dev" -%} datalake_dev
      {%- elif target.name == "prod"  -%} datalake
      {%- elif target.name == "test"  -%} datalake_dev
      {%- else -%} datalake_dev
      {%- endif -%}
    +schema: github # leave blank for just the target_schema

  fivetran_log:
    +tags: ["daily"]
    +grants:
      select: "{{ ['engineering', 'datamanagement'] if target.name in ['prod', 'test', 'ci'] else []}}"
    +database: |
      {%- if  target.name == "dev" -%} datalake_dev
      {%- elif target.name == "prod"  -%} datalake
      {%- elif target.name == "test"  -%} datalake_dev
      {%- else -%} datalake_dev
      {%- endif -%}
    +schema: fivetran_log # leave blank for just the target_schema
    staging:
