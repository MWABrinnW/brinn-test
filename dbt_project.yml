        +tags: ["financials"]
        enterprise:
          +schema: enterprise
          +grants:
            select: "{{ ['db_edw_general_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      locations:
        +tags: ["locations"]
        build:
          +schema: build
          +grants:
            select: "{{ ['engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"
        enterprise:
          +schema: enterprise
          +grants:
            select: "{{ ['db_edw_general_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        ref:
          +schema: ref
          +grants:
            select: "{{ ['db_edw_general_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      metrics:
        +tags: ["metrics", "daily"]
        +grants:
          select: "{{ ['engineering', 'datamanagement', 'reporting', 'integration_reporting'] if target.name in ['prod', 'test', 'ci'] else []}}"
        build:
          +schema: build
          +grants:
            select: "{{ ['engineering', 'datamanagement'] if target.name in ['prod', 'test', 'ci'] else []}}"


      referral_fees:
        +enabled: true
        +tags: ["revenue", "referral_fees"]
        build:
          +schema: build
          +grants:
            select: "{{ ['engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"
        enterprise:
          +schema: enterprise
          +grants:
