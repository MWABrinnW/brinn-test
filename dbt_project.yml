        +grants:
          select: "{{ ['engineering', 'datamanagement'] if target.name in ['prod', 'test', 'ci'] else []}}"

      prices:
        +tags: ["prices"]
        +schema: ref
        +grants:
          select: "{{ ['db_edw_general_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

seeds:
  data_engineering:
    # By default seeds will go into datalake.aux
    +database: |
      {%- if  target.name == "dev" -%} datalake_dev
      {%- elif target.name == "prod"  -%} datalake
      {%- elif target.name == "test"  -%} datalake_dev
      {%- else -%} datalake_dev
      {%- endif -%}
    +schema: aux
    datalake:
      +database: |
        {%- if  target.name == "dev" -%} datalake_dev
        {%- elif target.name == "prod"  -%} datalake
        {%- elif target.name == "test"  -%} datalake_dev
        {%- else -%} datalake_dev
        {%- endif -%}
      +schema: aux

    edw:
      +database: |
        {%- if  target.name == "dev" -%} edw_dev
        {%- elif target.name == "prod"  -%} edw
        {%- elif target.name == "test"  -%} edw_dev
        {%- else -%} edw_dev
        {%- endif -%}
      +schema: ref
