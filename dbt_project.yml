# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "data_engineering"
version: "1.0.0"
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: "default"

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target" # directory which will store compiled SQL files
clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# [Configuring models]
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/ directory
# as tables. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.

vars:
  dbt_date:time_zone: "America/Chicago"
  lookback: 3
  offset: 0
  dev_day_filter: 7
  incremental_mode: lookback
  lookback_custodial: 14
  disable_run_results: "{{ target.name not in ['prod', 'test'] }}"
  disable_tests_results: "{{ target.name not in ['prod', 'test'] }}"
  disable_dbt_invocation_autoupload: "{{ target.name not in ['prod', 'test'] }}"
  disable_dbt_artifacts_autoupload: "{{ target.name not in ['prod', 'test'] }}"

on-run-start:
  - "{{ create_schemas() if target.name in ['prod', 'test', 'ci'] }}"
on-run-end:
  - "{{ grant_usage_on_schemas_where_select() if target.name in ['prod', 'test'] }}"

models:
  ## see docs: https://docs.elementary-data.com/
  elementary:
    +schema: "elementary"
    +grants:
      select: ['engineering']
    enabled: "{{ target.name in ['prod', 'test'] }}"

  data_engineering:
    +persist_docs:
      relation: true
      columns: true
    +dbt-osmosis: "_{parent}__models.yml"

    # By default models will go in the datalake db
    +database: |
      {%- if  target.name == "dev" -%} datalake_test
      {%- elif target.name == "prod"  -%} datalake
      {%- elif target.name == "test"  -%} datalake_test
      {%- else -%} datalake_test
      {%- endif -%}

    # [BASE]
    base:
      +materialized: view
      +tags: ["base"]

      active_directory:
        +tags: ["active_directory", "hr", "employees", "associates"]
        +grants:
          select: "{{ ['db_hr_gen_r', 'db_it_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      adp:
        +tags: ["adp", "hr", "employees", "associates"]
        +grants:
          select: "{{ ['db_hr_assoc_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      alteryx_gallery:
        +tags: ["alteryx"]
        +grants:
          select: "{{ ['engineering', 'datamanagement'] if target.name in ['prod', 'test', 'ci'] else []}}"

      auxy:
        +tags: ["aux"]
        +grants:
          select: "{{ ['engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"
        +dbt-osmosis: "_aux__models.yml"

      cais:
        +tags: ["cais", "mwa"]
        +grants:
          select: "{{ ['db_custodial_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      cch_dau:
        +tags: ["cch_dau"]
        +grants:
          select: "{{ ['db_billing_tax_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      culture_amp:
        +tags: ["culture_amp", "hr"]
        +grants:
          select: "{{ ['db_hr_assoc_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      cusip:
        +tags: ["cusip"]
        +grants:
          select: "{{ ['db_custodial_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      custodian:
        +tags: ["custodian", "custodial"]
        fidelity:
          +tags: ["fidelity"]
          +grants:
            select: "{{ ['engineering', 'datamanagement'] if target.name in ['prod', 'test', 'ci'] else []}}"
        fidelity_mps:
          +tags: ["fidelity", "mps"]
          +grants:
            select: "{{ ['db_custodial_mps_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        fidelity_swag:
          +tags: ["fidelity", "swag"]
          +grants:
            select: "{{ ['db_custodial_mps_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        fidelity_msec:
          +tags: ["fidelity", "msec"]
          +grants:
            select: "{{ ['db_custodial_msec_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        fidelity_mwa:
          +tags: ["fidelity", "mwa"]
          +grants:
            select: "{{ ['db_custodial_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        lpl_network:
          +tags: ["lpl", "network", "mps"]
          +grants:
            select: "{{ ['db_custodial_mps_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        schwab:
          +tags: ["schwab"]
          +dbt-osmosis: "_{model}.yml"
          stg:
            +grants:
              select: "{{ ['engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"
          base:
            +grants:
              select: "{{ ['db_custodial_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        schwab_mps:
          +tags: ["schwab", "mps"]
          +grants:
            select: "{{ ['db_custodial_mps_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        schwab_mwa:
          +tags: ["schwab", "mwa"]
          +grants:
            select: "{{ ['db_custodial_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        tda:
          +tags: ["tda", "mwa", "mps", "network"]
          +grants:
            select: "{{ ['db_custodial_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        tda_mwa:
          +tags: ["tda", "mwa"]
          +grants:
            select: "{{ ['db_custodial_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        pershing_mps:
          +tags: ["pershing", "mps"]
          +grants:
            select: "{{ ['db_custodial_mps_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        pershing_mwa:
          +tags: ["pershing", "mwa"]
          +grants:
            select: "{{ ['db_custodial_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      dbt:
        +tags: ["dbt"]
        +database: "{{ target.database }}"
        +schema: "{{ target.schema }} "
        +grants:
          select: "{{ ['engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"

      edw_legacy:
        +tags: ["edw", "employees", "associates"]

      emoney:
        +tags: ["emoney"]
        mwa:
          +tags: ["mwa"]
          +grants:
            select: "{{ ['db_custodial_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      freshservice:
        +tags: ["freshservice"]
        +grants:
          select: "{{ ['db_it_r', 'reporting'] if target.name in ['prod', 'test', 'ci'] else []}}"

      hubspot_network:
        +tags: ["hubspot", "network", "hubspot_network"]
        +grants:
          select: "{{ ['db_crm_mps_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      icims:
        +tags: ["icims", "hr"]
        +grants:
          select: "{{ ['db_hr_talent_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      pardot:
        +tags: ["pardot"]
        +grants:
          select: "{{ ['db_crm_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      pms:
        +tags: ["pms"]
        +grants:
          select: "{{ ['db_pms_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      redtail_network:
        +tags: ["redtail", "network"]
        +grants:
          select: "{{ ['db_crm_mps_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      rise:
        +tags: ["rise"]
        +grants:
          select: "{{ ['engineering', 'datamanagement', 'reporting', 'integration_reporting'] if target.name in ['prod', 'test', 'ci'] else []}}"

      salesforce_adviceperiod:
        +tags: ["crm", "salesforce"]
        +grants:
          select: "{{ ['db_crm_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      salesforce_compass:
        +tags: ["crm", "salesforce"]
        +grants:
          select: "{{ ['db_crm_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      salesforce_corbenic:
        +tags: ["crm", "salesforce"]
        +grants:
          select: "{{ ['db_crm_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      salesforce_msec:
        +tags: ["crm", "salesforce", "msec"]
        +grants:
          select: "{{ ['db_crm_msec_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      xcm:
          +tags: ["tax","xcm"]
          +dbt-osmosis: "_{model}.yml"
          +grants:
            select: "{{ ['db_crm_tax_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      zoom:
        +tags: ["zoom"]
        +grants:
          select: "{{ ['db_it_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

    # [DEVOPS]

    devops:
      +tags: ["devops"]
      +database: |
        {%- if  target.name == "dev" -%} devops_test
        {%- elif target.name == "prod"  -%} devops
        {%- elif target.name == "test"  -%} devops_test
        {%- else -%} devops_test
        {%- endif -%}
      +grants:
        +select: "{{ ['engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"
      +dbt-osmosis: "_{model}.yml"

      activetick:
        +tags: ["activetick"]
      lifi:
        +tags: ["lifi"]
      moxy:
        +tags: ["moxy"]
        +enabled: false
      options:
        +tags: ["options", "options_reporting"]

    # [EDW]
    edw:
      +tags: ["edw"]
      +database: |
        {%- if  target.name == "dev" -%} edw_test
        {%- elif target.name == "prod"  -%} edw
        {%- elif target.name == "test"  -%} edw_test
        {%- else -%} edw_test
        {%- endif -%}
      +dbt-osmosis: "_{model}.yml"

      advisors:
        +tags: ["advisors", "network"]
        enterprise:
          +schema: enterprise
          +grants:
            select: "{{ ['db_edw_general_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      custodian:
        +tags: ["custodian", "custodial", "custodian-master"]
        build:
          +schema: build
          +grants:
            select: "{{ ['engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"
        enterprise:
          +schema: enterprise
          +grants:
            select: "{{ ['db_edw_client_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        ref:
          +schema: ref
          +grants:
            select: "{{ ['db_edw_client_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      pms:
        +tags: ["pms", "pms-master"]
        build:
          +schema: build
          +grants:
            select: "{{ ['engineering', 'datamanagement'] if target.name in ['prod', 'test', 'ci'] else []}}"
        # enterprise:
        #   +schema: enterprise
        #   +grants:
        #     select: "{{ ['db_edw_general_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      employees:
        +tags: ["employees", "associates"]
        build:
          +schema: build
          +grants:
            select: "{{ ['engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"
        enterprise:
          +schema: enterprise
          +grants:
            select: "{{ ['db_hr_assoc_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
          employees:
            +grants:
              select: "{{ ['db_edw_general_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
          employee_census:
            +grants:
              select: "{{ ['db_edw_general_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        legacy:
          +schema: legacy
          +grants:
            select: "{{ ['db_hr_assoc_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      locations:
        +tags: ["locations"]
        build:
          +schema: build
          +grants:
            select: "{{ ['engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"
        enterprise:
          +schema: enterprise
          +grants:
            select: "{{ ['db_edw_general_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
        ref:
          +schema: ref
          +grants:
            select: "{{ ['db_edw_general_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      referral_fees:
        +enabled: true
        +tags: ["revenue", "referral_fees"]
        build:
          +schema: build
          +grants:
            select: "{{ ['engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"
        enterprise:
          +schema: enterprise
          +grants:
            select: "{{ ['engineering', 'datamanagement', 'db_edw_revenue_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"

      reports:
        +tags: ["report", "reports"]
        +schema: reports
        +grants:
          select: "{{ ['engineering', 'datamanagement'] if target.name in ['prod', 'test', 'ci'] else []}}"

seeds:
  data_engineering:
    # By default seeds will go into datalake.aux
    +database: |
      {%- if  target.name == "dev" -%} datalake_test
      {%- elif target.name == "prod"  -%} datalake
      {%- elif target.name == "test"  -%} datalake_test
      {%- else -%} datalake_test
      {%- endif -%}
    +schema: aux
    datalake:
      +database: |
        {%- if  target.name == "dev" -%} datalake_test
        {%- elif target.name == "prod"  -%} datalake
        {%- elif target.name == "test"  -%} datalake_test
        {%- else -%} datalake_test
        {%- endif -%}
      +schema: aux

    edw:
      +database: |
        {%- if  target.name == "dev" -%} edw_test
        {%- elif target.name == "prod"  -%} edw
        {%- elif target.name == "test"  -%} edw_test
        {%- else -%} edw_test
        {%- endif -%}
      +schema: ref
