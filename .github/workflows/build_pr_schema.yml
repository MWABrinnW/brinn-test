      #   run: |
      #     $dest_dir = $env:DEST_DIR
      #     if (!(Test-Path -Path "$dest_dir")) {
      #       New-Item -Path "$dest_dir" -ItemType Directory
      #     }
      #     if (Test-Path -Path "./target/catalog.json" -PathType leaf) {
      #       Write-Host "Copying catalog.json to $dest_dir"
      #       Copy-Item "./target/catalog.json" -Destination "$dest_dir" -Force
      #       } else { Write-Host "catalog.json not found" }
