name: Drop PR Schema

on:
  pull_request:
    types: [ closed ]

env:
  AWS_REGION: "us-east-2"
  AWS_ROLE_ARN: "arn:aws:iam::436867865803:role/dbt-docs-github-actions"
  DBT_DOCS_BUCKET: "dbt-docs.marinerapi.cloud"
  SNOWSQL_USER: ${{ vars.DBT_USER }}
  SNOWSQL_PWD: ${{ secrets.DBT_PASSWORD }}
  SNOWSQL_ACCOUNT: ${{ vars.DBT_HOST }}
  SNOWSQL_DATABASE: DBT
  SNOWSQL_SCHEMA: DBT
  PR_NUM: ${{ github.event.number }}

jobs:
  drop-pr-schema:
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: self-hosted
    steps:
      - name: drop pr schema
        shell: pwsh
        env:
          PR_NUM: ${{ github.event.number }}
        run: |
          $drop_sql = "drop schema if exists $($env:SNOWSQL_DATABASE).$($env:PR_NUM);"
          Write-Host $drop_sql
          snowsql -q "$drop_sql"

      - name: Delete the Docs
        run: |
          .\utilities\.venv\Scripts\Activate.ps1
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          aws s3 rm s3://${{ env.DBT_DOCS_BUCKET }}/${{ env.PR_NUM }} --recursive
