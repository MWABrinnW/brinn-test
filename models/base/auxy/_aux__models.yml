version: 2

models:
  - name: aux__base_locations
    config:
      tags: ['locations']
    description: >
      Primary purpose for this table is to assign a Mariner Location ID to each Mariner Location.
      That ID/name is used throughout a number of systems (ex. Great Plains, ADP, Salesforce, Enterprise Reporting, etc).
      The Location Master is also where the the hierarchy of Region/Market/Location is kept, along with other ancillary levels (Division, Legal, and Tax hierarchy) will be found.
    columns:
      - name: start_date
        description: Unique identifier for each Location Master record.
      - name: end_date
        description: Start date the new location is active.
      - name: active_directory
        description: True = active; False = Inactive
      - name: general_access
        description: "True = everyone can see code; False = restricted view NOTE: This is always set to True."
      - name: location_code
        description: Mariner Location ID for the location (ex. 100, L-10015)
      - name: division
        description: "Division: separates Wealth, Advisory Solutions, and HQ"
      - name: legal_name
        description: Legal entity
      - name: region_name
        description: Region name, markets are grouped into a region
      - name: market_name
        description: Market name, locations are grouped into a market
      - name: location_name
        description: Location name, offices are grouped into a location
      - name: office_name
        description: "Office name/location in the format of 'City, State'"
      - name: location_city
        description: Location city
      - name: location_state
        description: Location state
      - name: accounting_id_description
        description: Great Plains accounting/cost code description (ex. Costa Mesa, CA; Costa Mesa, CA - MSEC; Costa Mesa, CA - MIR),
      - name: accounting_id
        description: Great Plains accounting/cost code (ex. 1104, 7704, 8804),
      - name: acquisition_name
        description: Name of firm purchase/acquisition or advisor lift-out,
      - name: acquisition_type
        description: Type of acquisition (ex. Advisor lift-out, Firm purchase, Significant hire, Greenfield, Tax Acquisition),
      - name: _created_at
        description: Datetime representing when the record was loaded into the table from the source file.

  - name: aux__base_locations_cost_center_history
    config:
      tags: ['locations']
    description: >
      Primary purpose for this table is to track prior accounting codes/cost centers for each location and the corresponding current accounting code.
      These accounting codes tie to Great Plains and ADP.
    columns:
      - name: start_date
        description: Start date the new location is active
      - name: end_date
        description: End date of current location OR date that current record will be modified and new record will start
      - name: old_code
        description: Great Plains accounting/cost code (ex. 1104, 7704, 8804) - prior code
      - name: current_code
        description: Great Plains accounting/cost code (ex. 1104, 7704, 8804) - current code
      - name: _created_at
        description: Datetime representing when the record was loaded into the table from the source file.

  - name: aux__base_employee_overrides
    tags: ['employees']
    description: >
      "Employee record value overrides and manual entries (box file id: 1085269023169)."
      Used by the HR team to make modification to employee records before they appear in the EDW.

  - name: aux__base_integration_roadmap
    description: This smartsheets file is maintained by the platforms team and details the roadmap for various location Orion integration activities.

  - name: aux__base_hfw_acct_data
    config:
      tags: ['hfw']
      grants:
        select: "{{ ['db_pms_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
  - name: aux__base_hfw_tpg_mstar_overlap
    config:
      tags: ['hfw']
      grants:
        select: "{{ ['db_pms_mwa_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
  - name: aux__stg_tda_account_mappings
    config:
      tags: ['tda', 'schwab']
      grants:
        select: "{{ ['engineering', 'datamanagement'] if target.name in ['prod', 'test', 'ci'] else []}}"
  - name: aux__stg_custodian_links
    description: >
      Custodian link catalog intended to
      1) Be comprehensive of all custodian links associated to accounts in Mariner data feeds.
      2) Capture the firm entity (firm_source) associated with each custodian link.
    config:
      tags: ['custodian']
      grants:
        select: "{{ ['datamanagement', 'engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"
    tests:
      - dbt_utils.mutually_exclusive_ranges:
          lower_bound_column: coalesce(effective_start_date, '1900-01-01')
          upper_bound_column: coalesce(effective_end_date, '2099-12-31')
          partition_by: custodian, link
          gaps: required
          zero_length_range_allowed: true
    columns:
      - name: CUSTODIAN
        description: 'Custodian name, lower-case, no spaces.'
        data_type: VARCHAR
      - name: LINK
        description: >
          'The custodian link value. Each custodian calls this something different and it functions specific to their platform. However, they all share similarities in that the value is associated to financial accounts and serves to "link" an account to a feed or certain access areas of a firm.'

          Schwab - master number (type FA or SL)
          Fidelity - G number (type primary or secondary)
          Pershing - Investment professional number
          LPL - Subscriber id and rep id
          TDA - rep code
        data_type: VARCHAR
      - name: EFFECTIVE_START_DATE
        description: 'When the link record first became effective. Null indicates all of history prior to the effective_end_date.'
        data_type: DATE
      - name: EFFECTIVE_END_DATE
        description: 'When the link record became inactive. Null indicates all of time after the effective_start_date.'
        data_type: DATE
      - name: FIRM_SOURCE
        description: 'Firm entity associated with the link value.'
        data_type: VARCHAR
      - name: LINK_TYPE
        description: 'The type of link (i.e. master number or G number). Each custodian has different link types.'
        data_type: VARCHAR
      - name: LINK_SUBTYPE
        description: 'Some custodians have primary, secondary, or other labels to indicate the type of link value.'
        data_type: VARCHAR
      - name: LINK_DESCRIPTION
        description: ''
        data_type: VARCHAR
      - name: LINK_SUBTYPE_DETAIL
        description: ''
        data_type: VARCHAR
      - name: DESCRIPTION
        description: ''
        data_type: VARCHAR
      - name: NOTES
        description: ''
        data_type: VARCHAR
      - name: LOCATION_CODE
        description: 'Location code assigned to the link. This is not always 1 to 1.'
        data_type: VARCHAR
      - name: LOCATION_CODE_NOTES
        description: ''
        data_type: VARCHAR
      - name: ADVISOR_EMAIL
        description: 'For link values that are associated to a single advisor, this is their email address.'
        data_type: VARCHAR
      - name: IS_DECEASED
        description: 'Is this a master/link designated for deceased clients.'
        data_type: NUMBER
      - name: HAS_TRADING_AUTHORITY
        description: 'Does this link value enable trading activity?'
        data_type: NUMBER
      - name: ADDED_DATE
        description: 'Manually maintained date to indicate when a link was added to the source spreadsheet.'
        data_type: DATE
      - name: ADDED_NOTES
        description: 'Manually maintained text field that can include context about who or why a link was added to the source spreadsheet.'
        data_type: VARCHAR
      - name: DEACTIVATED_DATE
        description: 'The date a link was deprecated or removed from service, if applicable.'
        data_type: DATE
      - name: IS_FROM_TDA_MIGRATION
        description: 'Is the Schwab master (link) related to the TDA migration in September 2023.'
        data_type: NUMBER
      - name: _BOX_FILE_ID
        description: 'The unique box file ID where the records are originally sourced.'
        data_type: VARCHAR
      - name: _BOX_SHEET_NAME
        description: 'The name of the box file sheet where the records are originally sourced.'
        data_type: VARCHAR
      - name: _SOURCE_LOADED_AT
        description: 'Time when the records were created in the source table.'
        data_type: TIMESTAMP_NTZ
  - name: aux__stg_referral_fees_san_adjustments
    config:
      tags: ['referral_fees']
      grants:
        select: "{{ ['datamanagement', 'engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"
