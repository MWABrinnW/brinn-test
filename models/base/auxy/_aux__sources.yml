version: 2

sources:
  - name: aux
    description: >
      The sources represent auxillary source systems and files,
      Typically resulting in the use of Box or Smartsheets files used for mapping or as supplemntary data not available elsewhere."
    database: "{{ var('db_datalake_src', env_var('DBT_DB_DATALAKE_SRC', 'datalake')) }}"

    tables:
      - name: locations
        tags: ['locations']
        description: >
          Primary purpose for this table is to assign a Mariner Location ID to each Mariner Location.
          That ID/name is used throughout a number of systems (ex. Great Plains, ADP, Salesforce, Enterprise Reporting, etc).
          The Location Master is also where the the hierarchy of Region/Market/Location is kept, along with other ancillary levels (Division, Legal, and Tax hierarchy) will be found.
      - name: employee_overrides
        tags: ['employees']
        description: >
          "Employee record value overrides and manual entries (box file id: 1085269023169)."
          Used by the HR team to make modification to employee records before they appear in the EDW.
      - name: integration_roadmap
        description: This smartsheets file is maintained by the platforms team and details the roadmap for various location Orion integration activities.
      - name: executive_wealth_account_data
        description: Supplemental data for Executive Wealth accounts that doesn't exist in Morningstar.
      - name: hfw_acct_data
        description: Supplemental data for HFW accounts that doesn't exist in Morningstar or TPG.
      - name: hfw_tpg_mstar_overlap
        description: Supplemental mapping for HFW accounts that exist in both Morningstar and TPG.
      - name: custodian_codes_master_list
        description: "Custodian codes master list meant to catalog custodian masters/gnumbers/rep codes/etc (box file id: 490214713493)."

      - name: vault
        description: Collection of various files and sources stored as json for schema on read.

      - name: custodian_codes
        description: "Custodian codes master list (box file id: 490214713493)"
