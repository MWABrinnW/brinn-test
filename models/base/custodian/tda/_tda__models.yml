- name: tda__base_accounts
  description: 'This table represents the tda account feed in its entirety. With other
    custodial feeds we know when an account is delinked because it no longer feeds
    in the files we are sent. TDA does not use this mechanism and does not offer an
    alternative for understanding when and if an account is not linked to a firm any
    longer. Accounts which may have left Mariner service weeks or months ago may still
    appear in this data.

    '
  columns:
  - name: CUSTODIAN
    description: ''
    data_type: VARCHAR
  - name: company_name
