- name: schwab_mwa_history__base_rps_cash
  columns:
  - name: CUSTODIAN
    description: Custodian name, lower-case, no spaces.
    data_type: VARCHAR
  - name: FIRM_SOURCE
    description: Firm entity associated with the link value.
    meta:
      row_access_policy: rap_firm_source
    data_type: VARCHAR
  - name: FIRM
    description: ''
    data_type: VARCHAR
  - name: RECORD_TYPE
    description: Identifies the record type (Header, Detail, Trailer) & Count (D1,
      D2)
    data_type: VARCHAR
  - name: CUSTODIAN_ID
    description: Custodian ID
    data_type: VARCHAR
  - name: MASTER_ACCOUNT_NUMBER
    description: Identifies the Master Account Number.
    data_type: VARCHAR
  - name: MASTER_ACCOUNT_NAME
    description: Identifies the Master Account by Name.
    data_type: VARCHAR
  - name: BUSINESS_DATE
    description: Business date for this transaction
    data_type: DATE
  - name: ACCOUNT_NUMBER
    description: End-client account number at Schwab.
    data_type: VARCHAR
  - name: ACCOUNT_TITLE_LINE_1
    description: May contain name, company or trust information, depending on account
      type.
    data_type: VARCHAR
  - name: ACCOUNT_TITLE_LINE_2
    description: May contain name, company or trust information, depending on account
      type.
    data_type: VARCHAR
  - name: ACCOUNT_TITLE_LINE_3
    description: May contain name, company or trust information, depending on account
      type.
    data_type: VARCHAR
  - name: ACCOUNT_REGISTRATION
    description: Registration at Schwab (Testamentary Trust, Living Trust, etc.) FEE,
      HOLD, JT, SIMPL, I401K, OMNI
    data_type: VARCHAR
  - name: ACCOUNT_TYPE
    description: Type of account (Brokerage, Schwab One, IRA, etc.) SCHWAB ONE, QUALIFIED
      RETIREMENT PLAN, BROKERAGE
    data_type: VARCHAR
  - name: NET_CREDIT_DEBIT
    description: ''
    data_type: NUMBER
  - name: MARGIN_BALANCE
    description: ''
    data_type: NUMBER
  - name: AVAILABLE_TO_PAY
    description: ''
    data_type: NUMBER
  - name: MARGIN_BUYING_POWER
    description: The maximum value of additional marginable securities that may be
      invested in, without deposit in equity in the margin account. Equivalent to
      SchwabLink "Cash05"
    data_type: NUMBER
  - name: MONEY_MARKET_FUNDS
    description: ''
    data_type: NUMBER
  - name: MTD_MARGIN_INTEREST
    description: Indicates the amount of interest that has accrued on the margin debit
      from the beginning of the interest period based on settled amount. Equivalent
      to SchwabLink "Cash09"
    data_type: NUMBER
  - name: DAILY_MARGIN_INTEREST
    description: The amount of margin interest accrued in the account today based
      on the previous business days debit balance based on settled amount. Equivalent
      to SchwabLink "Cash10"
    data_type: NUMBER
  - name: EQUITY_EXCLUDING_OPTIONS
    description: The dollar value of securities in the margin account less any amount
      owed to Schwab plus any cash in the margin account. Equivalent to SchwabLink
      "Cash11"
    data_type: NUMBER
  - name: EQUITY_PERCENTAGE
    description: The equity in the margin account divided by the market value of positions
      held. Equivalent to SchwabLink "Cash12"
    data_type: NUMBER
  - name: MARKET_VALUE_LONG
    description: The market value of security positions held in the margin account,
      excluding options and non-marginable securities. Equivalent to SchwabLink "Cash13"
    data_type: NUMBER
  - name: MARKET_VALUE_SHORT
    description: Total market value of all securities excluding options held short.
      Equivalent to SchwabLink "Cash14"
    data_type: NUMBER
  - name: EQUITY_INCLUDING_OPTIONS
    description: The dollar value of securities in the margin account less any amount
      owed to Schwab plus any cash in the margin account. Margin Equity + Margin Option
      MVL + Margin Option MVS. Equivalent to SchwabLink "Cash15"
    data_type: NUMBER
  - name: OPTION_REQUIREMENTS
    description: Total equity requirement to maintain the current option position.
      Do not use (always zero). Equivalent to SchwabLink "Cash16"
    data_type: NUMBER
  - name: MONTH_END_DIVIDEND_PAYOUT
    description: Total dividends to be mailed out at the end of the month. Equivalent
      to SchwabLink "Cash17"
    data_type: NUMBER
  - name: MAINTENANCE_CALL
    description: Total amount required to maintain the account at Schwabs minimum
      equity level. Equivalent to Schwablink "Cash18"
    data_type: NUMBER
  - name: MARKET_VALUE_CASH_ACCOUNT_EXCLUDING_OPTIONS
    description: ''
    data_type: NUMBER
  - name: NET_MARKET_VALUE_POSITIONS_ONLY
    description: Net (long minus short) market value of all securities (including
      options) held in both the Cash Account and the Margin Account. Equivalent to
      PCRA Cash19.
    data_type: NUMBER
  - name: NET_MARKET_VALUE_POSITIONS_PLUS_CASH_AND_MONEY_MARKET
    description: Equal to "Net Market Value (Positions Only)" above, plus uninvested
      cash and sweep money market. Equivalent to PCRA Cash20.
    data_type: NUMBER
  - name: CASH_BALANCE_SETTLED_ONLY
    description: Amount or value of cash in the Cash accounting pool. Settled only.
    data_type: NUMBER
  - name: CASH_MARGIN_BALANCE_SETTLED
    description: ''
    data_type: NUMBER
  - name: BANK_SWEEP_INTEREST_BEARING_FEATURE
    description: Dollar amount of the bank sweep IBF. For accounts with the bank sweep
      IBF, subtract this value from 'Net Credit or Debit  Settled & Unsettled' to
      get uninvested cash.
    data_type: NUMBER
  - name: MASTER_NUMBER
    description: ''
    data_type: VARCHAR
  - name: EFFECTIVE_DATE
    description: ''
    data_type: DATE
  - name: IS_HEAD
    description: ''
    data_type: NUMBER
  - name: IS_CURRENT
    description: ''
    data_type: NUMBER
  - name: _SOURCE_LOADED_AT
    description: Time when the records were created in the source table.
    data_type: TIMESTAMP_NTZ
  - name: _SOURCE_FILE
    description: ''
    data_type: VARCHAR
- name: schwab_mwa_history__base_rps_positions
  columns:
  - name: CUSTODIAN
    description: Custodian name, lower-case, no spaces.
    data_type: VARCHAR
  - name: FIRM_SOURCE
    description: Firm entity associated with the link value.
    meta:
      row_access_policy: rap_firm_source
    data_type: VARCHAR
  - name: FIRM
    description: ''
    data_type: VARCHAR
  - name: RECORD_TYPE
    description: Identifies the record type (Header, Detail, Trailer) & Count (D1,
      D2)
    data_type: VARCHAR
  - name: CUSTODIAN_ID
    description: Custodian ID
    data_type: VARCHAR
  - name: MASTER_ACCOUNT_NUMBER
    description: Identifies the Master Account Number.
    data_type: VARCHAR
  - name: MASTER_ACCOUNT_NAME
    description: Identifies the Master Account by Name.
    data_type: VARCHAR
  - name: BUSINESS_DATE
    description: Business date for this record
    data_type: DATE
  - name: ACCOUNT_NUMBER
    description: End-client account number at Schwab.
    data_type: VARCHAR
  - name: PRODUCT_CODE
    description: Further defines Product Category Code.   Identifies type of security
      (e.g. Common Stock, GNMA, Unit Trust, Mutual Fund, etc.) FNM, FMC, COM, BMU,
      CDO, MMS (there are several dozen)
    data_type: VARCHAR
  - name: PRODUCT_CATEGORY_CODE
    description: 'Highest level of security classification.

      DEBT - Includes all fixed income

      DERV - (Derivatives) Options, Warrants

      EQTY - Equity/Stock (Common, Preferred, ADR, MLP, REIT)

      O - (Other)  Includes all types of mutual funds.

      '
    data_type: VARCHAR
  - name: TAX_CODE
    description: A security type classification related to the tax status of the security.
    data_type: VARCHAR
  - name: LEGACY_SECURITY_TYPE
    description: These security type codes are considered obsolete and are provided
      only for backwards compatibility. Interface developers are encouraged instead
      to use the Product Code, Product Category Code, And Tax Code because these codes
      offer greater specificity and will always match Schwab's broker dealer system.
    data_type: VARCHAR
  - name: TICKER_SYMBOL
    description: An arrangement of characters (usually letters) representing a particular
      security listed on an exchange or otherwise traded publicly which may have been
      modified by Schwab.  MAI2Z, COL2Z or DPB1Z
    data_type: VARCHAR
  - name: INDUSTRY_TICKER_SYMBOL
    description: This field will match the Ticker Symbol field in most cases. MAIVX,
      COLFX or PTEBX
    data_type: VARCHAR
  - name: CUSIP
    description: Committee on Uniform Securities Identification Procedures. A CUSIP
      number identifies most securities.
    data_type: VARCHAR
  - name: SCHWAB_SECURITY_NUMBER
    description: Inernal Schwab security identifier
    data_type: VARCHAR
  - name: ITEM_ISSUE_ID
    description: Unique internal Schwab security identifier when combined with following
      field "Rule Set Suffix ID"
    data_type: VARCHAR
  - name: RULE_SET_SUFFIX_ID
    description: Combine with prior field  "Item Issue ID" to yield a unique identifier.
    data_type: VARCHAR
  - name: ISIN
    description: International Securities Identification Number. A unique international
      code which identifies a securities issue.
    data_type: VARCHAR
  - name: SEDOL
    description: The Stock Exchange Daily Official List number, a code used by the
      London Stock Exchange to identify foreign stocks.
    data_type: VARCHAR
  - name: OPTIONS_DISPLAY_SYMBOL
    description: Schwab formatted symbol for Options on confirms and statements.
    data_type: VARCHAR
  - name: SECURITY_DESCRIPTION_LINE_1
    description: Full Name of the Security
    data_type: VARCHAR
  - name: SECURITY_DESCRIPTION_LINE_2
    description: Full Name of the Security
    data_type: VARCHAR
  - name: SECURITY_DESCRIPTION_LINE_3
    description: Full Name of the Security
    data_type: VARCHAR
  - name: SECURITY_DESCRIPTION_LINE_4
    description: Full Name of the Security
    data_type: VARCHAR
  - name: UNDERLYING_TICKER_SYMBOL
    description: An arrangement of characters (usually letters) representing a particular
      parent security listed on an exchange or otherwise traded publicly.
    data_type: VARCHAR
  - name: UNDERLYING_INDUSTRY_TICKER_SYMBOL
    description: This field will match the Underlying Ticker Symbol field in most
      cases.
    data_type: VARCHAR
  - name: UNDERLYNG_CUSIP
    description: ''
    data_type: VARCHAR
  - name: UNDERLYING_SCHWAB_SECURITY_NUMBER
    description: Internal Schwab parent security identifier.
    data_type: VARCHAR
  - name: UNDERLYING_ITEM_ISSUE_ID
    description: Unique internal Schwab parent security identifier when combined with
      following fields
    data_type: VARCHAR
  - name: UNDERLYING_RULE_SET_SUFFIX_ID
    description: Combine with prior field to yield a unique parent identifier.
    data_type: VARCHAR
  - name: UNDERLYING_ISIN
    description: International Securities Identification Number. A unique international
      code which identifies a parent securities issue.
    data_type: VARCHAR
  - name: UNDERLYING_SEDOL
    description: The Stock Exchange Daily Official List number, a code used by the
      London Stock Exchange to identify foreign stocks. Underlying SEDOL being specific
      to the parent SEDOL.
    data_type: VARCHAR
  - name: MONEY_MARKET_CODE
    description: Unique code to identify Schwab money market products.
    data_type: VARCHAR
  - name: DIVIDEND_REINVEST
    description: Indicates whether dividends are reinvested for this security. Blank
      means there is no explicit instruction specified by the customer, and by default
      cash dividends will not be reinvested.
    data_type: VARCHAR
  - name: CAPITAL_GAINS_REINVEST
    description: Indicates whether capital gains are reinvested for this security.
      Blank means there is no explicit instruction specified by the customer, and
      by default capital gains distributions will not be reinvested.
    data_type: VARCHAR
  - name: CLOSING_PRICE
    description: 'Closing price in Schwab systems.

      OBSOLETE field, use \"Closing Price - Unfactored.\"

      '
    data_type: NUMBER
  - name: SECURITY_PRICE_UPDATE_DATE
    description: Last Security Price Update Date
    data_type: DATE
  - name: QUANTITY_SETTLED_UNSETTLED
    description: ''
    data_type: FLOAT
  - name: LONG_SHORT_INDICATOR
    description: Indicates whether "Quantity (Settled and Unsettled)" is long or short.
    data_type: VARCHAR
  - name: MARKET_VALUE_SETTLED_UNSETTLED
    description: ''
    data_type: NUMBER
  - name: ACCOUNTING_RULE_CODE
    description: Identifies the type of account associated with the position. Previously
      account type was only Cash or Margin. (Margin previously included Margin, Short
      and When Issued) CASH, MARGIN, WHEN ISSUED, SHORT
    data_type: VARCHAR
  - name: QUANTITY_SETTLED
    description: Total number of settled shares
    data_type: NUMBER
  - name: QUANTITY_UNSETTLED_LONG
    description: Total number of unsettled shares held long
    data_type: NUMBER
  - name: QUANTITY_UNSETTLED_SHORT
    description: Total number of unsettled shares held short
    data_type: NUMBER
  - name: TIPS_FACTOR
    description: 'The inflation factor associated with Treasury Inflation-Protected
      Securities. Use this value to calculate the \"clean\" price.  This data element,
      if available, is also included in the Security Description fields. For securities
      that are not TIPS (Product Code not equal to \"TIP\") then this field will be
      zero-filled.

      OBSOLETE field, use \"Factor.\"

      '
    data_type: NUMBER
  - name: ASSET_BACKED_FACTOR
    description: 'The security''s current factor. This data element, if available,
      is also included in the Security Description fields. For securities without
      a factor this field will be zero-filled.

      OBSOLETE field, use \"Factor.\"

      '
    data_type: NUMBER
  - name: CLOSING_PRICE_UNFACTORED
    description: Closing price in Schwab systems. For securities where a factor applies,
      the value provided does not reflect the factor. Multiply by the Factor  value
      in the next field for a factored price.
    data_type: NUMBER
  - name: FACTOR
    description: The security's current factor. For securities without a factor, the
      factor value will default to 1. Applies to TIPS, asset-backed securities, and
      other securities where a factor exists.
    data_type: NUMBER
  - name: FACTOR_DATE
    description: The date associated with the Factor value provided in the previous
      field.
    data_type: DATE
  - name: MASTER_NUMBER
    description: ''
    data_type: VARCHAR
  - name: EFFECTIVE_DATE
    description: ''
    data_type: DATE
  - name: IS_HEAD
    description: ''
    data_type: NUMBER
  - name: IS_CURRENT
    description: ''
    data_type: NUMBER
  - name: _SOURCE_LOADED_AT
    description: Time when the records were created in the source table.
    data_type: TIMESTAMP_NTZ
  - name: _SOURCE_FILE
    description: ''
    data_type: VARCHAR
