    description: Indicates who will receive the proxy voting ballot - currently in
      Client Preferences application D, M, A
    data_type: VARCHAR
  - name: PROXY_MAILING
    description: Indicates if duplicate copy is mailed to client, IA, or neither.
      D, M, A, S, N
    data_type: VARCHAR
  - name: STATEMENT_PREFERENCES
    description: Displays the current statement type for the account. TTST, CMPT
    data_type: VARCHAR
  - name: ACCOUNT_TAXABLE_INDICATOR
    description: "Account Taxable Indicator indicates whether Schwab will report taxes.\n\
      \ Y = Account is tax reportable\n N = Account is non-tax reportable\n"
    data_type: VARCHAR
  - name: DEFAULT_LOT_SELECTION_METHOD
    description: 'Default account level lot selection method:

      FIFO -- First In, First Out

      LIFO -- Last In, First Out

      HCLOT -- Highest Cost Lot

      LCLOT -- Lowest Cost Lot

      BTAX -- Tax Lot Optimizer.

      '
    data_type: VARCHAR
  - name: COST_METHOD
    description: 'Default account level cost method

      A = Average

      I = Identified

      M = Mixed

      Blank = unknown

      The value of Mixed results in Mutual Funds set as Average and all other securities
      set as Identified.

      '
    data_type: VARCHAR
  - name: COST_BASIS_METHOD_FOR_MUTUAL_FUNDS
    description: 'Default accounting method for mutual funds held in the account.

      FIFO = first in, first out

      LIFO = last in, first out

      HCLOT = high cost

      LCLOT = low cost

      BTAX = Tax Lot Optimizer

      AVG = Average

      '
    data_type: VARCHAR
  - name: COST_BASIS_METHOD_NON_MUTUAL_FUNDS
    description: 'Default accounting method for securities other than mutual funds
      in the account.

      FIFO = first in, first out

      LIFO = last in, first out

      HCLOT = high cost

      LCLOT = low cost

      BTAX = Tax Lot Optimizer

      '
    data_type: VARCHAR
  - name: COST_BASIS_METHOD_DATE
    description: Effective date for Cost Basis Method
    data_type: DATE
  - name: CUSTOMER_TYPE
    description: 'Shows whether the customer is an individual person, a trust, or
      an organization. Possible values are "IND" (an individual person)

      "TRUST" (a trust)

      "ORG" (an organization, e.g. corporation)

      '
    data_type: VARCHAR
  - name: ORGANIZATION_PRIMARY_NAME
    description: 'If Customer Type is a trust or organization ("TRUST" or "ORG" )
      then this field will be populated with the name of the trust or organization
      associated with the account. If Customer Type is an individual person (IND)
      then this field will be blank (spaces.)

      '
    data_type: VARCHAR
  - name: RESTRICTION_REASON_CODE_1
