    description: CUSIP
    data_type: VARCHAR
  - name: SCHWAB_SECURITY_NUMBER
    description: ''
    data_type: VARCHAR
  - name: ITEM_ISSUE_ID
    description: 'Unique internal Schwab security identifier. If no data is available,
      the field will be blank.  NOTE:  This is highly unlikely to happen.'
    data_type: VARCHAR
  - name: ISIN
    description: International Securities Identification Number.  A unique international
      code which identifies a securities issue.
    data_type: VARCHAR
  - name: SEDOL
    description: The Stock Exchange Daily Official List number; a code used by the
      London Stock Exchange to identify foreign stocks
    data_type: VARCHAR
  - name: OPTION_DISPLAY_SYMBOL
    description: ''
    data_type: VARCHAR
  - name: UNDERLYING_TICKER_SYMBOL
    description: Ticker symbol representing a particular parent security.
    data_type: VARCHAR
  - name: UNDERLYING_CUSIP
    description: CUSIP specific to the parent security.
    data_type: VARCHAR
  - name: UNDERLYING_SCHWAB_NUMBER
    description: ''
    data_type: VARCHAR
  - name: UNDERLYING_ITEM_ISSUE_ID
    description: Unique internal Schwab parent security identifier.
    data_type: VARCHAR
  - name: UNDERLYING_ISIN
    description: International Securities Identification Number. A unique international
      code which identifies a parent securities issue.
    data_type: VARCHAR
  - name: UNDERLYING_SEDOL
    description: The Stock Exchange Daily Official List number, a code used by the
      London Stock Exchange to identify foreign stocks. Underlying SEDOL being specific
      to the parent SEDOL.
    data_type: VARCHAR
  - name: CURRENT_QUANTITY
    description: 'Number of shares currently open on the lot. If no data is available,
      the field will be zero-filled.  NOTE:  This is highly unlikely to happen if
      the lot is open.'
    data_type: FLOAT
  - name: LONG_SHORT_INDICATOR
    description: 'Denotes whether shares are held long or short:

      S = Short

      L = Long

      If no data is available, the field will be set to L.

      '
    data_type: VARCHAR
  - name: TRANSACTION_CODE
    description: 'Describes reason for the opening activity.

      See tab \"Transaction Codes\" in this Workbook for values used exclusively in
      the Cost Basis Data files.

      See Schwab B/D Core Data Files Technical Specifications for a list of additional
      codes in the tab \"Transaction Source Codes.\"

      If no data is available, the field will be set to blank.

      '
    data_type: VARCHAR
  - name: CURRENT_MARKET_VALUE
    description: Identifies a position value as of the close of the prior business
      day.
    data_type: FLOAT
  - name: ACCRUED_INTEREST
    description: ''
    data_type: FLOAT
  - name: ACQUIRED_DATE
    description: 'Date the security was acquired. This is generally the trade date
      on the purchase of a stock. If Acquired Date is unavailable, this field will
      be blank.

      Use this field to match lots, not Original Purchase Date.

      '
    data_type: DATE
  - name: ORIGINAL_PURCHASE_DATE
    description: Field is necessary for VSP (Versus Purchase) processing. If Original
      Purchase Date is unknown, this field will be blank. If no data is available,
      the field will be set to blank.
    data_type: DATE
  - name: ORIGINAL_PURCHASE_PRICE
    description: Field is necessary for VSP (Versus Purchase) processing.  If Original
      Purchase Price is unknown, This field will have a zero value. If no data is
      available, the field will be zero-filled.
    data_type: FLOAT
  - name: YIELD_TO_MATURITY
    description: ''
    data_type: FLOAT
  - name: COST_BASIS_UNAMORTIZED
    description: ''
    data_type: FLOAT
  - name: COST_PER_SHARE
    description: ''
    data_type: FLOAT
  - name: ADJUSTED_COST_BASISI_AMORTIZED
    description: ''
    data_type: FLOAT
  - name: ADJUSTED_COST_PER_SHARE
    description: Adjusted Cost Per Share.  Total adjusted cost of the lot including
      commissions and/or fees divided by the number of shares purchased.  Calculated
      after lot has been amortized.  If no data is available (when cost basis is unknown
      for the lot) this field will be zero-filled.
    data_type: FLOAT
  - name: UNREALIZED_GAIN_LOSS
    description: ''
    data_type: FLOAT
  - name: DAYS_HELD
    description: ''
    data_type: NUMBER
  - name: HT
    description: ''
    data_type: VARCHAR
  - name: COST_BASIS_FULLY_KNOWN
    description: 'Indicates if cost basis is fully known:

      T (= True when the lot has known cost basis)

      F (= False when the lot has unknown cost basis)

      If no data is available, the field will be set to F.

      '
    data_type: VARCHAR
  - name: COST_BASIS_TYPE
    description: 'The event origin of the cost basis:

      A (= Advisor ) Cost Basis provided by a financial advisor.

      B (= Back Office ) Cost Basis provided by a Schwab customer rep.

      E (= End Customer) Cost Basis was provided by the customer.

      F (= Trade) Cost Basis provided by Schwab systems.

      T (= Third party) Cost Basis provided by a third party.

      U (= Unknown) Lot has unknown Cost Basis.

      If no data is available, the field will be set to blank.

      '
    data_type: VARCHAR
  - name: ACCOUNT_TAXABLE_INDICATOR
    description: "Account Taxable Indicator indicates whether Schwab will report taxes.\n\
      \ Y = Account is tax reportable\n N = Account is non-tax reportable\n"
    data_type: VARCHAR
  - name: CERTIFIED_INDICATOR
    description: 'Indicates whether there is a full set of Cost Basis data:

      Y( = Certified) Deliver cost basis and adjusted cost basis data as appropriate.

      N (= Not Certified) Deliver no cost basis data.

      B (= Basic Certified) Deliver cost basis data only (no adjusted cost basis).

      If no data is available, the field will be blank.

      '
    data_type: VARCHAR
  - name: ORIGINAL_FACE
    description: The par value of a mortgage-backed security at the time it is issued.  This
      field will have a zero value for non-fixed income securities. If no data is
      available, the field will be zero-filled.
    data_type: FLOAT
  - name: ACCOUNT_LOT_SELECTION_METHOD_DEFAULT
    description: 'Default lot selection method set for the account. Values can be
      one of the following:

      FIFO -- First In, First Out

      LIFO -- Last In, First Out

      HCLOT -- Highest Cost Lot

      LCLOT -- Lowest Cost Lot

      BTAX -- Tax Lot Optimizer

      If no data is available, the field will be blank.

      '
    data_type: VARCHAR
  - name: COST_METHOD
    description: ''
    data_type: VARCHAR
  - name: DISALLOWED_LOSS_AMOUNT
    description: ''
    data_type: FLOAT
  - name: TRANSACTION_COST
    description: The cost without the effect of wash sale processing.
    data_type: FLOAT
  - name: TRANSACTION_COST_PER_SHARE
    description: The cost per share based on the Transaction Cost.
    data_type: FLOAT
  - name: GI
    description: ''
    data_type: VARCHAR
  - name: ORIGINAL_COST_BASIS
    description: The original cost basis is the original purchase price per share
      multiplied by the current quantity.  The original price per share has not been
      adjusted for items such as return of capital, wash sales, or amortization and
      accretion.  This field can be used to compare or reconcile original cost basis
      of fixed income to original cost basis tracked in  Portfolio Management Systems.  This
      field can be used to determine the original purchase price of any security before
      any adjustments.  The field will not include commissions for Corporate, Municipal
      and Agency bonds.
    data_type: FLOAT
  - name: ADJUSTED_COST_INCLUDED_GUNP_AMORTIZED
    description: ''
    data_type: FLOAT
  - name: MASTER_NUMBER
    description: ''
    data_type: VARCHAR
  - name: EFFECTIVE_DATE
    description: ''
    data_type: DATE
  - name: IS_HEAD
    description: ''
    data_type: NUMBER
  - name: IS_CURRENT
    description: ''
    data_type: NUMBER
  - name: _SOURCE_LOADED_AT
    description: Time when the records were created in the source table.
    data_type: TIMESTAMP_NTZ
  - name: _SOURCE_FILE
    description: ''
    data_type: VARCHAR
