    description: "Indicates whether the account is enabled for Prime Broker trading.\n\
      \ Y = Account is enabled for Prime Broker Trading\n N = Account is not enabled\
      \ for Prime Broker trading\n"
    data_type: VARCHAR
  - name: MANAGED_ACCOUNT_PLATFORM_CODE
    description: 'Identifies the Schwab Managed Account Platform. May be blank.

      ACC = Managed Account Access

      MAA = Managed Account Connection (formerly Affiliates)

      MAM = Managed Account Marketplace

      MAS = Managed Account Select

      SMPF = Schwab Managed Portfolios - Mutual Funds

      SMPS = Schwab Managed Portfolios - ETFs

      '
