    meta:
      row_access_policy: rap_firm_source
    data_type: VARCHAR
  - name: FIRM
    description: ''
    data_type: VARCHAR
  - name: CUSTODIAN_ID
    description: Identifies Schwab as the source of the file.
    data_type: VARCHAR
  - name: MASTER_ACCOUNT_NUMBER
    description: Identifies the master account number associated with creating this
      record.
    data_type: VARCHAR
  - name: MASTER_ACCOUNT_NAME
    description: Identifies the master account name associated with creating this
      record.
    data_type: VARCHAR
  - name: BUSINESS_DATE
    description: Date for which data content is current.
    data_type: DATE
  - name: ACCOUNT_NUMBER
    description: End client account number at Schwab
    data_type: VARCHAR
  - name: PRODUCT_CODE
    description: 'Further defines Product Category Code.   Identifies type of security:
      FNM, FMC, COM, BMU, CDO, COM, MMS (there are several dozen)'
    data_type: VARCHAR
  - name: PRODUCT_CATEGORY_CODE
    description: OBSOLETE Highest level of security classification. Identifies type
      of security.
    data_type: VARCHAR
  - name: TAX_CODE
    description: OBSOLETE Determines where security payments appear on tax forms.
    data_type: VARCHAR
