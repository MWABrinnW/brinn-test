  - name: ACCOUNT_TITLE_LINE_1
    description: May contain name, company or trust information, depending on account
      type.
    data_type: VARCHAR
  - name: ACCOUNT_TITLE_LINE_2
    description: May contain name, company or trust information, depending on account
      type.
    data_type: VARCHAR
  - name: ACCOUNT_TITLE_LINE_3
    description: May contain name, company or trust information, depending on account
      type.
    data_type: VARCHAR
  - name: ACCOUNT_REGISTRATION
    description: Registration at Schwab (Testamentary Trust, Living Trust, etc.) FEE,
      HOLD, JT, SIMPL, I401K, OMNI
    data_type: VARCHAR
  - name: ACCOUNT_TYPE
    description: Type of account (Brokerage, Schwab One, IRA, etc.) SCHWAB ONE, QUALIFIED
      RETIREMENT PLAN, BROKERAGE
    data_type: VARCHAR
  - name: PRODUCT_CODE
    description: Further defines Product Category Code.   Identifies type of security
      (e.g. Common Stock, GNMA, Unit Trust, Mutual Fund, etc.) FNM, FMC, COM, BMU,
      CDO, COM, MMS (there are several dozen)
    data_type: VARCHAR
  - name: PRODUCT_CATEGORY_CODE
    description: 'Highest level of security classification.

      DEBT - Includes all fixed income

      DERV - (Derivatives) Options, Warrants

      EQTY - Equity/Stock (Common, Preferred, ADR, MLP, REIT)

      O - (Other)  Includes all types of mutual funds.

      '
    data_type: VARCHAR
  - name: TAX_CODE
    description: Determines where security payments appear on tax forms.
    data_type: VARCHAR
  - name: LEGACY_SECURITY_TYPE
    description: These security type codes are considered obsolete and are provided
      only for backwards compatibility. Interface developers are encouraged instead
      to use the Product Code, Product Category Code, And Tax Code because these codes
      offer greater specificity and will always match Schwab's broker dealer system
    data_type: VARCHAR
  - name: TICKER_SYMBOL
    description: An arrangement of characters (usually letters) representing a particular
      security listed on an exchange or otherwise traded publicly which may have been
      modified by Schwab. MAI2Z, COL2Z, DPBIZ
    data_type: VARCHAR
  - name: INDUSTRY_TICKER_SYMBOL
    description: This field will match the Ticker Symbol field in most cases   MAIVX,
      COLFX, PTEBX
    data_type: VARCHAR
  - name: CUSIP
    description: Committee on Uniform Securities Identification Procedures. A CUSIP
      number identifies most securities
    data_type: VARCHAR
  - name: SCHWAB_SECURITY_NUMBER
    description: Internal Schwab security identifier
    data_type: VARCHAR
  - name: ITEM_ISSUE_ID
    description: Unique internal Schwab security identifier when combined with the
      following field "Rule Set Suffix ID".
    data_type: VARCHAR
  - name: RULE_SET_SUFFIX_ID
    description: Combine with prior field "Item Issue ID" to yield a unique identifier.
    data_type: VARCHAR
  - name: ISIN
    description: International Securities Identification Number. A unique international
      code which identifies a securities issue
    data_type: VARCHAR
  - name: SEDOL
    description: The Stock Exchange Daily Official List number, a code used by the
      London Stock Exchange to identify foreign stocks
    data_type: VARCHAR
  - name: OPTIONS_DISPLAY_SYMBOL
    description: Schwab formatted symbol for Options on confirms and statements.
    data_type: VARCHAR
  - name: UNDERLYING_TICKER_SYMBOL
    description: An arrangement of characters (usually letters) representing a particular
      parent security listed on an exchange or otherwise traded publicly
    data_type: VARCHAR
  - name: UNDERLYING_INDUSTRY_TICKER_SYMBOL
    description: This field will match the Underlying Ticker Symbol field in most
      cases
    data_type: VARCHAR
  - name: UNDERLYING_CUSIP
    description: Committee on Uniform Securities Identification Procedures. A CUSIP
      number identifies most securities. Underlying CUSIP being specific to the parent
      security.
    data_type: VARCHAR
  - name: UNDERLYING_SCHWAB_SECURITY_NUMBER
    description: Internal Schwab parent security identifier
    data_type: VARCHAR
  - name: UNDERLYING_ITEM_ISSUE_ID
    description: Unique internal Schwab parent security identifier when combined with
      following fields
    data_type: VARCHAR
  - name: UNDERLYING_RULE_SET_SUFFIX_ID
    description: Combine with prior field to yield a unique parent identifier
    data_type: VARCHAR
  - name: UNDERLYING_ISIN
    description: International Securities Identification Number. A unique international
      code which identifies a parent securities issue
    data_type: VARCHAR
  - name: UNDERLYING_SEDOL
    description: The Stock Exchange Daily Official List number, a code used by the
      London Stock Exchange to identify foreign stocks. Underlying SEDOL being specific
      to the parent SEDOL.
    data_type: VARCHAR
  - name: MONEY_MARKET_CODE
    description: Unique code to identify Schwab money market products.
    data_type: VARCHAR
  - name: TRANSACTION_TYPE_CODE
    description: 'Specifies the highest-level transaction type:

      FC = Funds Cashiering,

      IC = Issue Cashiering,

      TR = Trade

      '
    data_type: VARCHAR
  - name: TRANSACTION_SUBTYPE_CODE
    description: ''
    data_type: VARCHAR
  - name: TRANSACTION_CATEGORY
    description: Matches the transaction filtering options available on SchwabAdvisorCenter.com
    data_type: VARCHAR
  - name: TRANSACTION_SOURCE_CODE
    description: Lowest-level transaction type. Regular trades will have the value,
      "TRADE," refer to "Action Code" field below for trade details. See "Transaction
      Source Codes."
    data_type: VARCHAR
  - name: TRANSACTION_SOURCE_CODE_DESCRIPTION
    description: Provides a short text description of the source code
    data_type: VARCHAR
  - name: TRANSACTION_DETAIL_DESCRIPTION
    description: Provides a detailed text description of the transaction
    data_type: VARCHAR
  - name: ACTION_CODE
    description: 'For trades only. Populated for all regular trades. Not just used
      for options trades. Examples: BUY, SELL, BCC, SCC, BPC, SPC, BCO, SCO, BPO,
      SCO.'
    data_type: VARCHAR
  - name: TRANSACTION_CANCEL_CODE
    description: 'Indicates a cancelled transaction. Y - Yes N - No

      '
    data_type: VARCHAR
  - name: TRADE_DATE
    description: 'The date the trade was executed. NOTE: This field is not the same
      as the "Transaction Date" in Schwab''s legacy transaction files. To match the
      Transaction Date in the legacy files, use ''Transaction Date'' instead.'
    data_type: DATE
  - name: SETTLEMENT_DATE
    description: The expected trade settlement date.
    data_type: DATE
  - name: TRANSACTION_DATE
    description: The actual date the transaction is to be recognized. The effective
      date of the transaction. This will be identical to the trade date in most cases.
      This date can, however, be different from trade date in rare instances, for
      example, if the trade was processed through a foreign exchange with a holiday
      schedule that differs from domestic exchanges.
    data_type: DATE
  - name: EX_DIVIDEND_DATE
    description: if applicable
    data_type: DATE
  - name: QUANTITY
    description: Number of units relevant to a record.
    data_type: FLOAT
  - name: PRICE
    description: Amount or value per unit or Quantity of a record.
    data_type: FLOAT
  - name: GROSS_AMOUNT
    description: Total amount or value of a trade record before deductions (Gross
      Amount = [Quantity * Price] + [Other Credits])
    data_type: FLOAT
  - name: DEBIT_CREDIT_INDICATOR
    description: Resolves direction and method of a record (In vs. Out and Cash vs.
      Trade/Exchange) CREDIT, DEBIT, LONG, SHORT
    data_type: VARCHAR
  - name: NET_AMOUNT
    description: Final amount or value of a record (Net Amount = Gross Amount - [All
      Fees and Withholdings]). May be zero for non-trade activity. Provides a negative
      sign for sell transactions. Interfaces may want to use absolute value instead.
    data_type: FLOAT
  - name: COMMISSION
    description: Amount or value of fee type - Commission
    data_type: FLOAT
  - name: EXCHANGE_PROCESSING_FEE
    description: Amount or value of fee type -  Exchange Processing. Formerly SEC
      fee.
    data_type: FLOAT
  - name: BROKER_SERVICE_FEE
    description: Amount or value of fee type - Broker Service. Formerly Handling fee.
    data_type: FLOAT
  - name: PRIME_BROKER_FEE
    description: Amount or value of fee type - Prime Broker.
    data_type: FLOAT
  - name: TRADE_AWAY_FEE
    description: Amount or value of fee type - Trade Away.
    data_type: FLOAT
  - name: REDEMPTION_FEE
    description: Amount or value of fee type -  Redemption.
    data_type: FLOAT
  - name: OTHER_FEE
    description: Amount or value of fee type - Other.
    data_type: FLOAT
  - name: FEDERAL_TEFRA_WITHHOLDING
    description: Valued for trades only.
    data_type: FLOAT
  - name: STATE_TAX_WITHHOLDING
    description: Only used for Hawaii and New Mexico. All other tax withholding is
      done with specific source codes in separate transactions
    data_type: FLOAT
  - name: STATE_RECEIVING_TAX
    description: 'State in which state tax implications due to transaction are implied.
      Note: The state provided in the transaction record will match the state in the
      address for the account in the build files and the Core Account Information
      file.'
    data_type: VARCHAR
  - name: ACCRUED_INTEREST
    description: Amount or value of interest relevant to a record
    data_type: FLOAT
  - name: ACCOUNTING_RULE_CODE
    description: Identifies the type of account associated with the transaction. Previously
      account type was only Cash or Margin. (Margin previously included Margin, Short
      and When Issued) CASH, MARGIN, WHEN ISSUED, SHORT
    data_type: VARCHAR
  - name: ORDER_SOURCE_CODE
    description: Code of the product or individual initiating trade.
    data_type: VARCHAR
  - name: ORDER_NUMBER
    description: The unique trade number assigned by Schwab for trade tracking purposes.
    data_type: NUMBER
  - name: TRADE_ORDER_ENTRY_TIME_STAMP
    description: The date and time stamp when the Order is entered.
    data_type: TIMESTAMP_NTZ
  - name: TRADE_ORDER_EXECUTION_TIME_STAMP
    description: The date and time stamp when the Order is executed.
    data_type: TIMESTAMP_NTZ
  - name: BROKER_CODE
    description: The unique number assigned to each executing broker.
    data_type: VARCHAR
  - name: BROKER_NAME
    description: Full name of executing broker
    data_type: VARCHAR
  - name: SCHWAB_FROM_ACCOUNT
    description: Schwab account from which value is drawn in a defined transfer (i.e.
      Fees or Journals).
    data_type: VARCHAR
  - name: SCHWAB_TO_ACCOUNT
    description: Schwab account to which value is added in a defined transfer (i.e.
      Fees or Journals).
    data_type: VARCHAR
  - name: SCHWAB1_CHECK_NUMBER
    description: Number of check issued in recorded transaction.
    data_type: VARCHAR
  - name: SWEEP_INDICATOR
    description: Indicates a sweep transaction Y - Yes N - No
    data_type: VARCHAR
  - name: STOCK_EXCHANGE_CODE
    description: Identifies the exchange that executed the trade OTC = Over The Counter,
      OTHR =  Others, PB = Prime Broker, TA = Trade Away, CBOE = Chicago Board Options
      Exchange, AM =  American Stock Exchange
    data_type: VARCHAR
  - name: INTER_CLASS_EXCHANGE_CODE
    description: Indicates an interclass exchange for mutual funds Y - Yes N - No
    data_type: VARCHAR
  - name: DISTRIBUTION_RATE
    description: Per share value of distribution. Used in combination with the Share
      Quantity to determine the total gross amount. Used for dividends, splits and
      spin offs
    data_type: FLOAT
  - name: CASH_IN_LIEU_SHARE_QUANTITY
    description: Number of shares used to calculate cash issued in place of share
      quantity on trades.
    data_type: FLOAT
  - name: DIVIDEND_INTEREST_SHARE_QUANTITY
    description: Number of Shares in the account on Record Date.
    data_type: FLOAT
  - name: CASH_IN_LIEU_RATE
    description: Per share value of cash issued in lieu of shares on trades.
    data_type: FLOAT
  - name: ASSET_BACKED_FACTOR
    description: 'The security''s current factor. This data element, if available,
      is also included in the Security Description fields. For securities without
      a factor this field will be zero-filled.

      OBSOLETE field, use \"Factor.\"

      '
    data_type: FLOAT
  - name: SOURCE_SYSTEM
    description: Describes the Schwab system that created the transaction. IC - Integrated
      Cashiering, ML - MoneyLink, TO - Transfer of Accounts
    data_type: VARCHAR
  - name: JOURNAL_TYPE
    description: Defines whether a journal transaction is for cash or stock. 01 -
      Cash  02 - Stock Space  - None (blank)
    data_type: VARCHAR
  - name: DEPOSIT_MEDIA
    description: Describes the form of deposit delivered to Schwab C - Check W - Wire
      J - Journal A - ACH (MoneyLink)
    data_type: VARCHAR
  - name: SCHWAB_CASHIERING_UNIQUE_IDENTIFIER
    description: Unique identifier generated by the Schwab Cashiering systems used
      to reconcile online requests with cashiering transactions in this file.
    data_type: VARCHAR
  - name: RECIPIENT_MAKER_NAME_1
    description: ''
    data_type: VARCHAR
  - name: RECIPIENT_MAKER_NAME_2
    description: ''
    data_type: VARCHAR
  - name: RECIPIENT_MAKER_NAME_3
    description: ''
    data_type: VARCHAR
  - name: FREQUENCY
    description: Indicates the frequency of the disbursement. ONE-TIME, WEEKLY, MONTHLY,
      QUARTERLY, ANNUAL, SEMI-ANNUAL
    data_type: VARCHAR
  - name: DISBURSED_CHECK_NUMBER
    description: This field may or may not be valued due to the account type.
    data_type: VARCHAR
  - name: FED_REFERENCE_NUMBER
    description: Tracking number assigned by the Fed Bank for Fed wire transactions.
    data_type: VARCHAR
  - name: FED_REFERENCE_NUMBER_2
    description: ''
    data_type: VARCHAR
  - name: BANK_ACCOUNT_TYPE
    description: Describes the type of account that is the source or destination of
      the funds. CHECKING, SAVINGS, UNKNOWN
    data_type: VARCHAR
  - name: BANK_NAME_PART_1
    description: Name of the Bank receiving or sending the funds.
    data_type: VARCHAR
  - name: BANK_NAME_PART_2
    description: Name of the Bank receiving or sending the funds.
    data_type: VARCHAR
  - name: BANK_ABA_NUMBER
    description: Unique account number assigned to sending or receiving bank.
    data_type: VARCHAR
  - name: INTERMEDIARY_NAME
    description: Name of the middle Bank assisting in the transfer of wired funds
    data_type: VARCHAR
  - name: TRANSACTION_CHECK_MEMO_1
    description: Memo line printed on the actual check.  This only applies to check
      disbursements.
    data_type: VARCHAR
  - name: TRANSACTION_CHECK_MEMO_2
    description: Memo line printed on the actual check.  This only applies to check
      disbursements.
    data_type: VARCHAR
  - name: RETIREMENT_FEDERAL_INCOME_TAX
    description: Amount of disbursement allocated to Federal tax.
    data_type: FLOAT
  - name: RETIREMENT_STATE_INCOME_TAX
    description: Amount of disbursement allocated to State tax.
    data_type: FLOAT
  - name: RETIREMENT_INCOME_TAX_STATE
    description: Two digit state code in which the state tax is being assessed.
    data_type: NUMBER
  - name: PUBLICATION_TIME_STAMP
    description: Use to match trade records with data found in the RGL files. Values
      are not meaningful except for trades.
    data_type: TIMESTAMP_NTZ
  - name: TIPS_FACTOR
    description: 'The inflation factor associated with Treasury Inflation-Protected
      Securities. Use this value to calculate the \"clean\" price.  This data element,
      if available, is also included in the Security Description fields. For securities
      that are not TIPS (Product Code not equal to \"TIP\") then this field will be
      zero-filled.

      OBSOLETE field, use \"Factor.\"

      '
    data_type: FLOAT
  - name: CLOSING_PRICE
    description: 'Closing price in Schwab systems.

      OBSOLETE field, use \"Closing Price - Unfactored.\"

      '
    data_type: FLOAT
  - name: TRANSACTION_MEMO
    description: 'Provides additional detail for some cashiering transactions on certain
      accounts.

      Most accounts do not use this field.

      '
    data_type: VARCHAR
  - name: CLOSING_PRICE_UNFACTORED
    description: Closing price in Schwab systems. For securities where a factor applies,
      the value provided does not reflect the factor. Multiply by the Factor  value
      in the next field for a factored price.
    data_type: FLOAT
  - name: FACTOR
    description: The security's current factor. For securities without a factor, the
      factor value will default to 1. Applies to TIPS, asset-backed securities, and
      other securities where a factor exists.
    data_type: FLOAT
  - name: FACTOR_DATE
    description: The date associated with the Factor value provided in the previous
      field.
    data_type: DATE
  - name: MASTER_NUMBER
    description: ''
    data_type: VARCHAR
  - name: EFFECTIVE_DATE
    description: ''
    data_type: DATE
  - name: IS_HEAD
    description: ''
    data_type: NUMBER
  - name: IS_CURRENT
    description: ''
    data_type: NUMBER
  - name: _SOURCE_LOADED_AT
    description: Time when the records were created in the source table.
    data_type: TIMESTAMP_NTZ
  - name: _SOURCE_FILE
    description: ''
    data_type: VARCHAR
