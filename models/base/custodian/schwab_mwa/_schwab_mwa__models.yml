    description: Indicates if client has given fee payment authorization to FA.
    data_type: VARCHAR
  - name: INTEREST_BEARING_FEATURE_CODE
    description: 'Identifies the unique interest bearing value on the account depending
      on the interest bearing feature

      BKOMS-Bank Sweep

      S1INT-Schwab One Interest

      SWEEP-Money Market Sweep fund

      '
    data_type: VARCHAR
  - name: INTEREST_BERAING_FEATURE_MONEY_MARKET_CODE
