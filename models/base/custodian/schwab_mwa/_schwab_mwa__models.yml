  - name: MANAGED_ACCOUNT_INVESTMENT_STRATEGY
    description: Identifies the Schwab Managed Account Investment Strategy. May be
      blank.
    data_type: VARCHAR
  - name: BANK_SWEEP_DISPLAY_NAME
    description: If the Interest Bearing Feature Code at offset 923-927  is 'BKOMS'
      then this field provides the full name of the bank sweep feature as displayed
      on other client-facing channels. If the Interest Bearing Feature Code is not
      'BKOMS' then this field will be blank [space-filled].
    data_type: VARCHAR
  - name: MASTER_NUMBER
    description: ''
    data_type: VARCHAR
  - name: IS_DECEASED
    description: Is this a master/link designated for deceased clients.
    data_type: NUMBER
  - name: IS_FROM_TDA_MIGRATION
    description: Is the Schwab master (link) related to the TDA migration in September
      2023.
    data_type: NUMBER
