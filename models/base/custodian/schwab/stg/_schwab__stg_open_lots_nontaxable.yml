version: 2

models:
  - name: schwab__stg_open_lots_nontaxable
    description: "[Schwab open non-taxable lots](https://marinerholdingsllc.app.box.com/file/851240724913)"
    columns:
      - name: custodian
        description: ""
        data_type: VARCHAR
      - name: firm_source
        description: ""
        data_type: VARCHAR
      - name: firm
        description: ""
      - name: record_type
        description: "Identifies whether a header, detail, or trailer record, and if a detail record, what type."
      - name: custodian_id
        description: "Identifies Schwab as the source of the file."
      - name: master_account_number
        description: "Identifies the master account number associated with creating this record."
      - name: master_account_name
        description: "Identifies the master account name associated with creating this record."
      - name: business_date
        description: "Date for which data content is current."
      - name: account_number
        description: "End client account number at Schwab"
      - name: product_code
        description: "Further defines Product Category Code.   Identifies type of security: FNM, FMC, COM, BMU, CDO, COM, MMS (there are several dozen)"
      - name: product_category_code
        description: "OBSOLETE Highest level of security classification. Identifies type of security."
      - name: tax_code
        description: "OBSOLETE Determines where security payments appear on tax forms."
      - name: symbol_ticker
        description: "Ticker Symbol - Note that Ticker Symbols for institutional mutual fund share classes are not provided. The street symbol is provided regardless of share class."
      - name: cusip
        description: "CUSIP"
      - name: schwab_internal_id
        description: "Schwab Security ID, also called Schwab Security Number"
      - name: item_issue_id
        description: "Unique internal Schwab security identifier. If no data is available, the field will be blank.  NOTE:  This is highly unlikely to happen."
      - name: isin
        description: "International Securities Identification Number.  A unique international code which identifies a securities issue."
      - name: sedol
        description: "The Stock Exchange Daily Official List number; a code used by the London Stock Exchange to identify foreign stocks"
      - name: options_display_symbol
        description: "A Schwab formatted version of the OCC series key."
      - name: underlying_ticker_symbol
        description: "Ticker symbol representing a particular parent security."
      - name: underlying_cusip
        description: "CUSIP specific to the parent security."
      - name: underlying_schwab_internal_id
        description: "Underlying Schwab Security ID"
      - name: underlying_item_issue_id
        description: "Unique internal Schwab parent security identifier."
      - name: underlying_isin
        description: "International Securities Identification Number. A unique international code which identifies a parent securities issue."
      - name: underlying_sedol
        description: "The Stock Exchange Daily Official List number, a code used by the London Stock Exchange to identify foreign stocks. Underlying SEDOL being specific to the parent SEDOL."
      - name: current_quantity
        description: "Number of shares currently open on the lot. If no data is available, the field will be zero-filled.  NOTE:  This is highly unlikely to happen if the lot is open."
      - name: long_short_indicator
        description: |
          Denotes whether shares are held long or short:
          S = Short
          L = Long
          If no data is available, the field will be set to L.
      - name: transaction_code
        description: |
          Describes reason for the opening activity.
          See tab \"Transaction Codes\" in this Workbook for values used exclusively in the Cost Basis Data files.
          See Schwab B/D Core Data Files Technical Specifications for a list of additional codes in the tab \"Transaction Source Codes.\"
          If no data is available, the field will be set to blank.
      - name: current_market_value
        description: "Identifies a position value as of the close of the prior business day."
      - name: accrued_interest_fixed_income
        description: |
          Interest that has accumulated between the most recent coupon payment and the current date of the file or the sale of the bond.  For non-fixed income securities, This field will have a zero value.
          NOTE:  The interest accrued is through the file date, not the end of the month, unless it happens to be the last day of the month.
          If no data is available, the field will be zero-filled.
          Accrued interest does not reflect the interest accrued for the business day just ended. Value in files is one day behind.
      - name: acquired_date
        description: |
          Date the security was acquired. This is generally the trade date on the purchase of a stock. If Acquired Date is unavailable, this field will be blank.
          Use this field to match lots, not Original Purchase Date.
      - name: original_purchase_date
        description: "Field is necessary for VSP (Versus Purchase) processing. If Original Purchase Date is unknown, this field will be blank. If no data is available, the field will be set to blank."
      - name: original_purchase_price
        description: "Field is necessary for VSP (Versus Purchase) processing.  If Original Purchase Price is unknown, This field will have a zero value. If no data is available, the field will be zero-filled."
      - name: yield_to_maturity_fixed_income
        description: "Amount or value of investment at time of maturity.  This field will have a zero value for short positions, asset backed securities, commercial paper and any fixed income security that is basic certified or uncertified. If no data is available, the field will be zero-filled."
      - name: cost_basis_unamortized_cost_basis_amount
        description: "Cost basis is the original purchase price of a security including commissions or markups, and it is used in determining capital gains or losses.  If cost basis has been adjusted by a stock split or return of capital, it is reflected in this field for all non-fixed income securities.  If no data is available (when cost basis is unknown for the lot) or the cost is actually zero, the field will be zero-filled. To determine if zero is an actual value versus an unknown value, check the Cost Basis Type field or Cost Basis Fully Known field to verify that cost basis is known."
      - name: cost_per_share_share_cost_amount
        description: "Total Cost of the security including commissions and/or fees divided by the number of shares purchased.  If no data is available (when cost basis is unknown for the lot) this field will be zero-filled."
      - name: adjusted_cost_basis_amortized_cost_basis_amount
        description: "Also known as amortized cost basis.  Shows the cost basis amortized over the life of the lot since held at Schwab.  To be delivered only for fixed income securities, i.e. Security Type = \"Fixed\" or \"ST Debt.\"   If no data is available (when cost basis is unknown for the lot) or the adjusted cost basis is actually zero, the field will be zero-filled. To determine if zero is an actual value versus an unknown value, check the cost basis type field or cost basis fully known field to verify that cost basis is known."
      - name: adjusted_cost_per_share
        description: "Adjusted Cost Per Share.  Total adjusted cost of the lot including commissions and/or fees divided by the number of shares purchased.  Calculated after lot has been amortized.  If no data is available (when cost basis is unknown for the lot) this field will be zero-filled."
      - name: unrealized_gain_loss_ugl
        description: |
          Fixed income:
          Market Value - Adjusted Cost Basis;
          Other securities:
          Market Value - Cost Basis
          If Cost Basis is unknown, this field will have a zero value.
      - name: number_of_days_held
        description: |
          Standard Calendar arithmetic
          Days held = Current Date - Acquired Date. If Acquired Date is unavailable, this field will have a zero value.
      - name: holding_period_term
        description: |
          An asset has a long-term holding period if it has been held, or is treated as having been held, for more than 1 year (calendar year plus 1 day):
          L (= Long Term)
          S (= Short Term)
          If Number of Days Held is unknown, field will be set to S (Short Term).
      - name: cost_basis_fully_known
        description: |
          Indicates if cost basis is fully known:
          T (= True when the lot has known cost basis)
          F (= False when the lot has unknown cost basis)
          If no data is available, the field will be set to F.
      - name: cost_basis_type
        description: |
          The event origin of the cost basis:
          A (= Advisor ) Cost Basis provided by a financial advisor.
          B (= Back Office ) Cost Basis provided by a Schwab customer rep.
          E (= End Customer) Cost Basis was provided by the customer.
          F (= Trade) Cost Basis provided by Schwab systems.
          T (= Third party) Cost Basis provided by a third party.
          U (= Unknown) Lot has unknown Cost Basis.
          If no data is available, the field will be set to blank.
      - name: account_taxable_indicator
        description: |
          Account Taxable Indicator indicates whether Schwab will report taxes.
           Y = Account is tax reportable
           N = Account is non-tax reportable
      - name: certified_indicator
        description: |
          Indicates whether there is a full set of Cost Basis data:
          Y( = Certified) Deliver cost basis and adjusted cost basis data as appropriate.
          N (= Not Certified) Deliver no cost basis data.
          B (= Basic Certified) Deliver cost basis data only (no adjusted cost basis).
          If no data is available, the field will be blank.
      - name: original_face
        description: "The par value of a mortgage-backed security at the time it is issued.  This field will have a zero value for non-fixed income securities. If no data is available, the field will be zero-filled."
      - name: account_lot_selection_method_default
        description: |
          Default lot selection method set for the account. Values can be one of the following:
          FIFO -- First In, First Out
          LIFO -- Last In, First Out
          HCLOT -- Highest Cost Lot
          LCLOT -- Lowest Cost Lot
          BTAX -- Tax Lot Optimizer
          If no data is available, the field will be blank.
      - name: wash_sale_impacted
        description: |
          Indicates whether the lot was or was not impacted by a wash sale:
          T = <True> - Indicates that the lot WAS impacted by a wash sale.
          F = <False> - Indicates that the lot WAS NOT impacted by a wash sale.
          If an account is not set up to track wash sales, this field will be blank.
          If no data is available, the field will be blank.
      - name: version_marker_1
        description: "Indicates the version number associated with the fields immediately following this marker."
      - name: disallowed_loss
        description: "Amount of disallowed loss applied to the cost basis of a lot due to a wash sale activity."
      - name: transaction_cost
        description: "The cost without the effect of wash sale processing."
      - name: transaction_cost_per_share
        description: "The cost per share based on the Transaction Cost."
      - name: version_marker_2
        description: "Indicates the version number associated with the fields immediately following this marker."
      - name: acquisition_type_gift_or_inherited
        description: |
          The acquisition type of a lot.  Denotes if a lot was inherited or gifted:
          \"I\" = Inherited
          \"G\" = Gifted
          Default if no data is available is blank [spaces].
      - name: original_cost_basis
        description: "The original cost basis is the original purchase price per share multiplied by the current quantity.  The original price per share has not been adjusted for items such as return of capital, wash sales, or amortization and accretion.  This field can be used to compare or reconcile original cost basis of fixed income to original cost basis tracked in  Portfolio Management Systems.  This field can be used to determine the original purchase price of any security before any adjustments.  The field will not include commissions for Corporate, Municipal and Agency bonds."
      - name: version_marker_3
        description: "Indicates the version number associated with the fields immediately following this marker."
      - name: adjusted_cost_including_unpaid_amortization
        description: "The adjusted cost basis that includes all applicable amortization/accretion adjustments accrued through today's date. If no unpaid amortization exists, the field will be zero-filled. Use this field when the value is not zero. If zero, no unpaid amortization exists for this lot, and cost is provided in the field Original Cost Basis or Cost Basis (Unamortized Cost Basis Amount).\""
      - name: master_number
        description: ""
      - name: is_deceased
        description: ""
        data_type: NUMBER
      - name: is_from_tda_migration
        description: ""
        data_type: NUMBER
      - name: effective_date
        description: ""
      - name: RN
        data_type: NUMBER
        description: ''
      - name: IS_HEAD
        data_type: NUMBER
        description: ''
      - name: IS_CURRENT
        data_type: NUMBER
        description: ''
      - name: _SOURCE_LOADED_AT
        data_type: TIMESTAMP_NTZ
        description: 'Time when the records were created in the source table.'
      - name: _SOURCE_FILE
        data_type: VARCHAR
        description: ''
