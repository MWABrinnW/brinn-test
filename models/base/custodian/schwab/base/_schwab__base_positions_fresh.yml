version: 2
models:
  - name: schwab__base_positions_fresh
    columns:
      - name: CUSTODIAN
        description: Custodian name, lower-case, no spaces.
      - name: FIRM_SOURCE
        description: Firm entity associated with the link value.
      - name: FIRM
        description: ''
      - name: RECORD_TYPE
        description: Identifies the record type (Header, Detail, Trailer) & Count (D1, D2)
      - name: USTODIAN_ID
        description: ''
      - name: ASTER_ACCOUNT_NUMBER
        description: ''
      - name: ASTER_ACCOUNT_NAME
        description: ''
      - name: USINESS_DATE
        description: ''
      - name: ACCOUNT_NUMBER
        description: End-client account number at Schwab.
      - name: PRODUCT_CODE
        description: >-
          Further defines Product Category Code.   Identifies type of security (e.g. Common Stock, GNMA,
          Unit Trust, Mutual Fund, etc.) FNM, FMC, COM, BMU, CDO, MMS (there are several dozen)
      - name: PRODUCT_CATEGORY_CODE
        description: |
          Highest level of security classification.
          DEBT - Includes all fixed income
          DERV - (Derivatives) Options, Warrants
          EQTY - Equity/Stock (Common, Preferred, ADR, MLP, REIT)
          O - (Other)  Includes all types of mutual funds.
      - name: TAX_CODE
        description: A security type classification related to the tax status of the security.
      - name: LEGACY_SECURITY_TYPE
        description: >-
          These security type codes are considered obsolete and are provided only for backwards compatibility.
          Interface developers are encouraged instead to use the Product Code, Product Category Code,
          And Tax Code because these codes offer greater specificity and will always match Schwab's broker
          dealer system.
      - name: TICKER_SYMBOL
        description: >-
          An arrangement of characters (usually letters) representing a particular security listed on
          an exchange or otherwise traded publicly which may have been modified by Schwab.  MAI2Z, COL2Z
          or DPB1Z
      - name: INDUSTRY_TICKER_SYMBOL
        description: This field will match the Ticker Symbol field in most cases. MAIVX, COLFX or PTEBX
      - name: CUSIP
        description: >-
          Committee on Uniform Securities Identification Procedures. A CUSIP number identifies most securities.
      - name: SCHWAB_SECURITY_NUMBER
        description: Inernal Schwab security identifier
      - name: ITEM_ISSUE_ID
        description: >-
          Unique internal Schwab security identifier when combined with following field "Rule Set Suffix
          ID"
      - name: RULE_SET_SUFFIX_ID
        description: Combine with prior field  "Item Issue ID" to yield a unique identifier.
      - name: ISIN
        description: >-
          International Securities Identification Number. A unique international code which identifies
          a securities issue.
      - name: SEDOL
        description: >-
          The Stock Exchange Daily Official List number, a code used by the London Stock Exchange to identify
          foreign stocks.
      - name: OPTIONS_DISPLAY_SYMBOL
        description: Schwab formatted symbol for Options on confirms and statements.
      - name: SECURITY_DESCRIPTION_LINE_1
        description: Full Name of the Security
      - name: SECURITY_DESCRIPTION_LINE_2
        description: Full Name of the Security
      - name: SECURITY_DESCRIPTION_LINE_3
        description: Full Name of the Security
      - name: SECURITY_DESCRIPTION_LINE_4
        description: Full Name of the Security
      - name: UNDERLYING_TICKER_SYMBOL
        description: >-
          An arrangement of characters (usually letters) representing a particular parent security listed
          on an exchange or otherwise traded publicly.
      - name: UNDERLYING_INDUSTRY_TICKER_SYMBOL
        description: This field will match the Underlying Ticker Symbol field in most cases.
      - name: UNDERLYING_CUSIP
        description: >-
          Committee on Uniform Securities Identification Procedures. A CUSIP number identifies most securities.
          Underlying CUSIP being specific to the parent security.
      - name: UNDERLYING_SCHWAB_SECURITY_NUMBER
        description: Internal Schwab parent security identifier.
      - name: UNDERLYING_ITEM_ISSUE_ID
        description: >-
          Unique internal Schwab parent security identifier when combined with following fields
      - name: UNDERLYING_RULE_SET_SUFFIX_ID
        description: Combine with prior field to yield a unique parent identifier.
      - name: UNDERLYING_ISIN
        description: >-
          International Securities Identification Number. A unique international code which identifies
          a parent securities issue.
      - name: UNDERLYING_SEDOL
        description: >-
          The Stock Exchange Daily Official List number, a code used by the London Stock Exchange to identify
          foreign stocks. Underlying SEDOL being specific to the parent SEDOL.
      - name: MONEY_MARKET_CODE
        description: Unique code to identify Schwab money market products.
      - name: DIVIDEND_REINVEST
        description: >-
          Indicates whether dividends are reinvested for this security. Blank means there is no explicit
          instruction specified by the customer, and by default cash dividends will not be reinvested.
      - name: CAPITAL_GAINS_REINVEST
        description: >-
          Indicates whether capital gains are reinvested for this security. Blank means there is no explicit
          instruction specified by the customer, and by default capital gains distributions will not be
          reinvested.
      - name: CLOSING_PRICE
        description: |
          Closing price in Schwab systems.
          OBSOLETE field, use \"Closing Price - Unfactored.\"
      - name: SECURITY_PRICE_UPDATE_DATE
        description: Last Security Price Update Date
      - name: QUANTITY_SETTLED_AND_UNSETTLED
        description: Total number of shares as-of the business date based on trade date.
      - name: LONG_SHORT_INDICATOR
        description: Indicates whether "Quantity (Settled and Unsettled)" is long or short.
      - name: MARKET_VALUE_SETTLED_AND_UNSETTLED
        description: Position market value as-of the business date based on trade date.
      - name: ACCOUNTING_RULE_CODE
        description: >-
          Identifies the type of account associated with the position. Previously account type was only
          Cash or Margin. (Margin previously included Margin, Short and When Issued) CASH, MARGIN, WHEN
          ISSUED, SHORT
      - name: QUANTITY_SETTLED
        description: Total number of settled shares
      - name: QUANTITY_UNSETTLED_LONG
        description: Total number of unsettled shares held long
      - name: QUANTITY_UNSETTLED_SHORT
        description: Total number of unsettled shares held short
      - name: VERSION_MARKER_1
        description: >-
          Indicates the version number associated with the fields immediately following this marker.
      - name: TIPS_FACTOR
        description: |
          The inflation factor associated with Treasury Inflation-Protected Securities. Use this value to calculate the \"clean\" price.  This data element, if available, is also included in the Security Description fields. For securities that are not TIPS (Product Code not equal to \"TIP\") then this field will be zero-filled.
          OBSOLETE field, use \"Factor.\"
      - name: ASSET_BACKED_FACTOR
        description: |
          The security's current factor. This data element, if available, is also included in the Security Description fields. For securities without a factor this field will be zero-filled.
          OBSOLETE field, use \"Factor.\"
      - name: VERSION_MARKER_2
        description: >-
          Indicates the version number associated with the fields immediately following this marker.
      - name: CLOSING_PRICE_UNFACTORED
        description: >-
          Closing price in Schwab systems. For securities where a factor applies, the value provided does
          not reflect the factor. Multiply by the Factor  value in the next field for a factored price.
      - name: FACTOR
        description: >-
          The security's current factor. For securities without a factor, the factor value will default
          to 1. Applies to TIPS, asset-backed securities, and other securities where a factor exists.
      - name: FACTOR_DATE
        description: The date associated with the Factor value provided in the previous field.
      - name: MASTER_NUMBER
        description: ''
      - name: IS_DECEASED
        description: Is this a master/link designated for deceased clients.
      - name: IS_FROM_TDA_MIGRATION
        description: Is the Schwab master (link) related to the TDA migration in September 2023.
      - name: EFFECTIVE_DATE
        description: ''
      - name: RN
        description: ''
      - name: RN_FIRM_SOURCE
        description: ''
      - name: RN_GLOBAL
        description: ''
      - name: _CREATED_AT
        description: ''
      - name: _SOURCE_LOADED_AT
        description: Time when the records were created in the source table.
      - name: _SOURCE_FILE
        description: ''
