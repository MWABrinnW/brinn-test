    tables:
      - name: acctbald
      - name: actvyd
      - name: nabase
      - name: positd
      - name: secmast
      - name: tlaopen_tax_accounting
      - name: tlaopendelta
      - name: tlaopenfull
      - name: trdrev_td

  - name: tda_mwa
    database: datalake
