version: 2

sources:
  - name: fidelity
    database: "{{ var('db_raw_src', env_var('DBT_DB_RAW_SRC', 'raw')) }}"
    schema: fidelity
    loaded_at_field: _created_at
    tables:
      - name: gnums
        description: "G number report from Fidelity Wealthscape"
        columns:
          - name: json
          - name: _source_file_date
          - name: _created_at
          - name: _source_file
          - name: _row_number
          - name: _checksum
      - name: option_reqs
        description: "Options requirements report from Fidelity Wealthscape"
        columns:
          - name: json
          - name: _source_file_date
          - name: _created_at
          - name: _source_file
          - name: _row_number
          - name: _checksum
