version: 2

sources:
  - name: alteryx_gallery
    description: Alteryx gallery data from mongodb.
    database: "{{ var('db_raw_src', env_var('DBT_DB_RAW_SRC', 'RAW')) }}"
    schema: alteryx_gallery
    tables:
      - name: appinfos
        columns:
          - name: JSON
            data_type: VARIANT
            description: ''
          - name: _CREATED_AT
            data_type: TIMESTAMP_NTZ
            description: ''
      - name: usagereports
        columns:
          - name: JSON
            data_type: VARIANT
            description: ''
          - name: _CREATED_AT
            data_type: TIMESTAMP_NTZ
            description: ''
      - name: users
        columns:
          - name: JSON
            data_type: VARIANT
            description: ''
          - name: _CREATED_AT
            data_type: TIMESTAMP_NTZ
            description: ''

  - name: alteryx_gallery_datalake
    description: Alteryx gallery data from mongodb.
    database: "{{ var('db_datalake_src', env_var('DBT_DB_DATALAKE_SRC', 'datalake')) }}"
    schema: alteryx_gallery
    tables:
      - name: alteryx_workflows_parsed
        description: 'Includes two datasets: 1) Global list of gallery workflows 2) Parsed contents of the workflows xml'
        columns:
          - name: JSON
            data_type: VARIANT
            description: ''
          - name: _CREATED_AT
            data_type: TIMESTAMP_NTZ
            description: ''
          - name: _SOURCE_FILE
            data_type: VARCHAR
            description: ''
