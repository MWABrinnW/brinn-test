version: 2

sources:
  - name: schwab_mwa
    database: "{{ env_var('DBT_DATALAKE_DB_SRC') }}"
    schema: schwab_mwa_history
    tables:
      - name: accounts
      - name: customer
      - name: positions
      - name: positions_cost_basis
      - name: securities
      - name: tax_lots
      - name: transactions

  - name: fidelity_mwa
    database: "{{ env_var('DBT_DATALAKE_DB_SRC') }}"
    schema: fidelity_mwa_history
    tables:
      - name: acctbald
      - name: actvyd
      - name: nabase
      - name: positd
      - name: secmast
      - name: tlaopen_tax_accounting
      - name: tlaopendelta
      - name: tlaopenfull
      - name: trdrev_td

  - name: fidelity_mps
    database: "{{ env_var('DBT_DATALAKE_DB_SRC') }}"
    schema: fidelity_mps_history
    tables:
      - name: acctbald
      - name: actvyd
      - name: nabase
      - name: positd
      - name: secmast
      - name: tlaopen_tax_accounting
      - name: tlaopendelta
      - name: tlaopenfull
      - name: trdrev_td

  - name: fideilty_msec_history
    database: "{{ env_var('DBT_DATALAKE_DB_SRC') }}"
    schema: fideilty_msec_history
    tables:
      - name: acctbald
      - name: actvyd
      - name: nabase
      - name: positd
      - name: secmast
      - name: tlaopendelta
      - name: tlaopenfull
      - name: trdrev_td

  - name: tda_mwa
    database: datalake
    schema: tda_mwa_history
    tables:
      - name: cost_basis
      - name: demographics
      - name: positions
      - name: prices
      - name: securities
      - name: transactions
    
