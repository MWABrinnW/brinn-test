        description: |
          Date the security was acquired. This is generally the trade date on the purchase of a stock. If Acquired Date is unavailable, this field will be blank.
          Use this field to match lots, not Original Purchase Date.
        data_type: DATE
      - name: PRODUCT_NAME
        data_type: VARCHAR
      - name: PRODUCT_TYPE
        data_type: VARCHAR
      - name: PRODUCT_CATEGORY
        data_type: VARCHAR
      - name: PRODUCT_ID
        data_type: NUMBER
      - name: ASSET_ID
        data_type: NUMBER
      - name: IS_ASSET_MANAGED
        data_type: NUMBER
      - name: LOT_ID
        data_type: VARCHAR
      - name: IS_PERFORM
        data_type: NUMBER
      - name: IS_MOXY
        data_type: NUMBER
      - name: IS_INTRADAY_IMPORT
        data_type: NUMBER
      - name: _CREATED_AT
        data_type: TIMESTAMP_LTZ
