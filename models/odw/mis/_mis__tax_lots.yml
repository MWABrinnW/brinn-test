version: 2
models:
  - name: mis__tax_lots
    description: |
      Tax lots for MIS accounts.

      Returns the latest available set of lots.
      Use session variable `EFFECTIVE_DATE` to retrieve the latest understanding for that date.

      Example:
      ```
      set EFFECTIVE_DATE = '2/28/2025';
      select effective_date, account_number
      from odw.mis.tax_lots
      limit 100
      ;
      ```
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          column_list: [effective_date, asset_id, lot_id]
          ignore_row_if: any_value_is_missing
          quote_columns: false
          row_condition: effective_date >= current_date() - 4
      - compare_describe_to_prod:
          name: compare_describe_to_prod_mis_bld_tax_lots
          state_database: odw
          state_schema: mis
          state_name: tax_lots
          summarize: false
          exclude_columns: [_created_at, is_head, is_current, _source_loaded_at, _source_file, _source,
            createddate, lot_id, is_intraday_import, account_id, asset_id, quantity, cost_per_share, product_id]
          where_clause: is_head = 1
          config:
            severity: warn
    columns:
      - name: EFFECTIVE_DATE
        description: ''
        data_type: DATE
      - name: CUSTODIAN
        description: ''
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER
        description: ''
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER_FORMATTED
        description: ''
        data_type: VARCHAR
      - name: CRM_ACCOUNT_NUMBER
        description: ''
