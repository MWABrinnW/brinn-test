version: 2
models:
  - name: active_directory__user_updates
    data_tests:
      - compare_describe_to_prod:
          name: compare_describe_to_prod_active_directory_user_updates
          state_database: odw
          state_schema: active_directory
          state_name: user_updates
          summarize: false
          include_columns: [employee_num, update_payload_detail, needs_updated, fields_to_update, is_excluded, cnt_fields_to_update]
          where_clause: none
          config:
            severity: warn
            store_failures_as: table
            enabled: "{{ target.name != 'prod' }}"
    columns:
      - name: EMPLOYEE_NUM
        description: >-
