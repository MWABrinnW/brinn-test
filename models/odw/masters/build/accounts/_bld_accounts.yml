version: 2
models:
  - name: bld_accounts
    data_tests:
      - compare_describe_to_prod:
          name: compare_describe_to_prod_bld_accounts
          config:
            severity: warn
            enabled: "{{ target.name != 'prod' }}"
          state_database: odw
          state_schema: build
          state_name: bld_accounts
          summarize: false
          include_columns: [effective_date, system_key, firm_source, account_number, is_active, location_code,
            pms_account_id, advisor, aum_classification, is_excluded]
          exclude_columns: [_created_at, is_head, is_current, _source_loaded_at, _source_file]
          where_clause: effective_date >= current_date() - 7
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          name: compare_row_count_bld_accounts
          config:
            severity: warn
            enabled: "{{ target.name != 'prod' }}"
          compare_model: odw.build.bld_accounts
          group_by: [effective_date, system_key]
          compare_group_by: [effective_date, system_key]
          row_condition: effective_date >= current_date() - 7
          compare_row_condition: effective_date >= current_date() - 7
    columns:
      - name: EFFECTIVE_DATE
        description: ''
      - name: SYSTEM_NAME
        description: ''
      - name: SYSTEM_INSTANCE
        description: Source system instance name.
      - name: SYSTEM_KEY
        description: Key for the PMS instance. PMS and PMS_INSTANCE_LOCATION concatenated.
      - name: FIRM_SOURCE
        description: mwa | mps | andco | baystate
        meta:
          row_access_policy: rap_firm_source
      - name: FIRM_SOURCE_VERIFIED
        description: ''
      - name: ACCOUNT_NUMBER_FORMATTED
        description: >-
          Account number including custodian or source sytem formatting such as hyphens, spacing, and
          case sensitivity.
      - name: ACCOUNT_NUMBER
        description: Account number without formatting or leading zeros.
      - name: CUSTODIAN
        description: Custodian name.
      - name: LINK
        description: The custodian master number, g number, rep code, or equivalent.
      - name: LINK_TYPE
        description: The type of link (i.e. master number or G number)
      - name: LINK_SUBTYPE
        description: >-
          Some custodians have primary, secondary, or other labels to indicate the type of link value.
      - name: ACCOUNT_TYPE
        description: 'Account type. Example: IRA Rollover.'
      - name: ACCOUNT_NAME
        description: Account name.
      - name: REGISTRANT_NAME
        description: Registration name.
      - name: CLIENT_NAME
        description: ''
      - name: IS_ACTIVE
        description: Is the account active (1 or 0).
      - name: CREATED_DATE
        description: Account created date, if available. Would be specific to the source system_key.
      - name: OPENED_DATE
        description: Account open or start date.
      - name: CLOSED_DATE
        description: Account close or cancel date.
      - name: ACCOUNT_VALUE
        description: Latest account market value.
      - name: ADVISOR
