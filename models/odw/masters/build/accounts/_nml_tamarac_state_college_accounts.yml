version: 2
models:
  - name: nml_tamarac_state_college_accounts
    data_tests:
      - compare_describe_to_prod:
          name: compare_describe_to_prod_nml_tamarac_state_college_accounts
          state_database: odw
          state_schema: build
          state_name: nml_tamarac_state_college_accounts
          summarize: false
          include_columns: [effective_date, system_key, firm_source, account_number, is_active, location_code,
            pms_account_id]
          exclude_columns: [_created_at, is_head, is_current, _source_loaded_at, _source_file]
          where_clause: effective_date >= current_date() - 7
          config:
            severity: warn
            enabled: "{{ target.name != 'prod' }}"
      - dbt_expectations.expect_table_columns_to_contain_set:
          name: check_column_list_nml_tamarac_state_college_accounts
