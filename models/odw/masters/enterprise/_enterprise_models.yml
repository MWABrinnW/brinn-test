version: 2
models:
  - name: accounts
    columns:
      - name: EFFECTIVE_DATE
        data_type: DATE
      - name: SYSTEM_NAME
        data_type: VARCHAR
      - name: SYSTEM_INSTANCE
        data_type: VARCHAR
      - name: SYSTEM_KEY
        data_type: VARCHAR
      - name: FIRM_SOURCE
        description: Firm entity associated with the link value.
        tests:
          - accepted_values:
              values: [
                'mwa',
                'mps',
                'andco',
                'baystate'
              ]
        meta:
          row_access_policy: rap_firm_source
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER_FORMATTED
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER
        description: End-client account number at Schwab.
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER_KEY
        data_type: VARCHAR
      - name: ACCOUNT_VALUE
        data_type: NUMBER
      - name: ACCOUNT_ID_CRM
        data_type: VARCHAR
      - name: ACCOUNT_ID_PMS
        data_type: VARCHAR
      - name: ACCOUNT_NAME
        data_type: VARCHAR
      - name: CLIENT_ID_CRM
        data_type: VARCHAR
      - name: CLIENT_ID_PMS
        data_type: VARCHAR
      - name: CLIENT_NAME
        data_type: VARCHAR
      - name: CUSTODIAN
        description: Custodian name, lower-case, no spaces.
        data_type: VARCHAR
      - name: AUM_CLASSIFICATION
        data_type: VARCHAR
        tests:
          - accepted_values:
              values: [
                'Data Aggregation / Reporting Only',
                'AUA - Assets Under Advisory',
                'Needs Classification',
                'Employee Account ( Non-AUA / Non-AUM )',
                'AUM - Assets Under Management'
              ]
              where: "is_legacy=0"
      - name: ADVISOR
        data_type: VARCHAR
      - name: IS_ACTIVE
        data_type: NUMBER
      - name: OPENED_DATE
        data_type: DATE
      - name: CLOSED_DATE
        data_type: DATE
      - name: LOCATION_CODE
        description: Location code assigned to the link. This is not always 1 to 1.
        data_type: VARCHAR
      - name: PMS_LOCATION_CODE
        data_type: VARCHAR
      - name: CRM_LOCATION_CODE
        data_type: VARCHAR
      - name: LINK
        description: The custodian master number, g number, rep code, or equivalent.
        data_type: VARCHAR
      - name: LINK_TYPE
        description: The type of link (i.e. master number or G number)
        data_type: VARCHAR
      - name: LINK_SUBTYPE
        description: >-
          Some custodians have primary, secondary, or other labels to indicate the type of link value.
        data_type: VARCHAR
      - name: IS_INSTITUTIONAL
        data_type: NUMBER
      - name: IS_DISCRETIONARY
        data_type: NUMBER
      - name: IS_MARKET_DAY
        data_type: NUMBER
      - name: IS_MARKET_MONTH_END
        data_type: NUMBER
      - name: IS_MANUAL_ACCOUNT
        data_type: NUMBER
      - name: IS_LEGACY
        data_type: NUMBER
      - name: _SOURCE_LOADED_AT
        description: Time when the records were created in the source table.
        data_type: TIMESTAMP_NTZ
      - name: _CREATED_AT
        data_type: TIMESTAMP_NTZ
      - name: _EXTRA_FIELDS
        data_type: VARIANT
  - name: holdings
    columns:
      - name: EFFECTIVE_DATE
        data_type: DATE
      - name: SYSTEM_NAME
        data_type: VARCHAR
      - name: SYSTEM_INSTANCE
        data_type: VARCHAR
      - name: SYSTEM_KEY
        data_type: VARCHAR
      - name: FIRM_SOURCE
        description: Firm entity associated with the link value.
        meta:
          row_access_policy: rap_firm_source
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER_FORMATTED
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER
        description: End-client account number at Schwab.
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER_KEY
        data_type: VARCHAR
      - name: ACCOUNT_VALUE
        data_type: NUMBER
      - name: ACCOUNT_ID_CRM
        data_type: VARCHAR
      - name: ACCOUNT_ID_PMS
        data_type: VARCHAR
      - name: ACCOUNT_NAME
        data_type: VARCHAR
      - name: CLIENT_ID_CRM
        data_type: VARCHAR
      - name: CLIENT_ID_PMS
        data_type: VARCHAR
      - name: CLIENT_NAME
        data_type: VARCHAR
      - name: CUSTODIAN
        description: Custodian name, lower-case, no spaces.
        data_type: VARCHAR
      - name: AUM_CLASSIFICATION
        data_type: VARCHAR
      - name: ADVISOR
        data_type: VARCHAR
      - name: IS_ACTIVE
        data_type: NUMBER
      - name: OPENED_DATE
        data_type: DATE
      - name: CLOSED_DATE
        data_type: DATE
      - name: ADVISOR_2
        data_type: VARCHAR
      - name: LOCATION_CODE
        description: Location code assigned to the link. This is not always 1 to 1.
        data_type: VARCHAR
      - name: PMS_LOCATION_CODE
        data_type: VARCHAR
      - name: CRM_LOCATION_CODE
        data_type: VARCHAR
      - name: LINK
        description: The custodian master number, g number, rep code, or equivalent.
        data_type: VARCHAR
      - name: LINK_TYPE
        description: The type of link (i.e. master number or G number)
        data_type: VARCHAR
      - name: LINK_SUBTYPE
        description: >-
          Some custodians have primary, secondary, or other labels to indicate the type of link value.
        data_type: VARCHAR
      - name: IS_MARKET_MONTH_END
        data_type: NUMBER
      - name: IS_INSTITUTIONAL
        data_type: NUMBER
      - name: IS_DISCRETIONARY
        data_type: NUMBER
      - name: IS_MANUAL_ACCOUNT
        data_type: NUMBER
      - name: CUSIP
        description: CUSIP
        data_type: VARCHAR
      - name: TICKER
        data_type: VARCHAR
      - name: IS_TICKER_CUSIP
        data_type: NUMBER
      - name: IS_CUSTODIAL_CASH
        data_type: NUMBER
      - name: SECURITY_ID
        data_type: NUMBER
      - name: SECURITY_NAME
        data_type: VARCHAR
      - name: SECURITY_TYPE
        description: |
          Identifies type of security:
          Fixed
          Deriv
          Eqty/MF
          Cash Eq
          Futures
          Forwards
          Index
          Option
          ST Debt
          If no data is available, the field will be blank.
        data_type: VARCHAR
      - name: security_subtype
        data_type: VARCHAR
      - name: ASSET_CLASS
        data_type: VARCHAR
      - name: MARKET_VALUE
        data_type: FLOAT
      - name: QUANTITY
        data_type: FLOAT
      - name: PRICE
        data_type: FLOAT
      - name: PRICE_UNFACTORED
        data_type: NUMBER
      - name: FACTOR
        description: >-
          The security's current factor. For securities without a factor, the factor value will default
          to 1. Applies to TIPS, asset-backed securities, and other securities where a factor exists.
        data_type: NUMBER
      - name: COST_BASIS
        data_type: FLOAT
      - name: IS_MANUAL_HOLDINGS
        data_type: NUMBER
      - name: IS_LEGACY
        data_type: NUMBER
