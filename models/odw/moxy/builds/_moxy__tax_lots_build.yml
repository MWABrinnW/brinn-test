version: 2
models:
  - name: moxy__tax_lots_build
    config:
      quoting:
        identifier: true
    columns:
      - name: TRANID
        data_type: NUMBER
      - name: PORTFOLIO
        data_type: VARCHAR
        description: |
          The portfolio ID.
          Dependence: Portfolio Information (MoxyPortfolio.PortID). In Moxy, choose System Portfolio Information.
        tests:
          - not_null
      - name: TYPE
        data_type: VARCHAR
        tests:
          - not_null
      - name: CURR
        data_type: VARCHAR
        tests:
          - not_null
      - name: SYMBOL
        data_type: VARCHAR
        tests:
          - not_null
      - name: POSTYPE
        data_type: NUMBER
        tests:
          - not_null
      - name: OCDATE
        data_type: VARCHAR
      - name: HLDATE
        data_type: VARCHAR
      - name: QUANTITY
        data_type: NUMBER
        tests:
          - not_null
      - name: TOTALCOST
        data_type: NUMBER
      - name: ISZEROMV
        data_type: NUMBER
        tests:
          - not_null
      - name: BROKER
        data_type: VARCHAR
      - name: CUSTODIAN
        data_type: VARCHAR
      - name: PLEDGE
        data_type: VARCHAR
      - name: PCALC
        data_type: NUMBER
      - name: IACTION
        data_type: NUMBER
      - name: LOTNUM
        data_type: VARCHAR
        tests:
          - not_null
          - unique
      - name: EXLOTID
        data_type: VARCHAR
        tests:
          - not_null
          - unique
      - name: TRADEMATCH
        data_type: VARCHAR
      - name: SWAPTRANID
        data_type: NUMBER
      - name: SETTLE
        data_type: VARCHAR
      - name: UGAINM
        data_type: VARCHAR
      - name: UGAINQ
        data_type: VARCHAR
      - name: UGAINY
        data_type: VARCHAR
      - name: USERDEF1
        data_type: VARCHAR
      - name: USERDEF2
        data_type: VARCHAR
      - name: USERDEF3
        data_type: VARCHAR
      - name: IS_INTRADAY_IMPORT
        data_type: NUMBER
