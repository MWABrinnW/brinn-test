version: 2
models:
  - name: moxy__prices_build
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - type
    columns:
      - name: TYPE
        data_type: VARCHAR
      - name: ISO
        data_type: VARCHAR
      - name: SYMBOL
        data_type: VARCHAR
      - name: PRICE
        data_type: NUMBER
      - name: IS_INTRADAY_IMPORT
        data_type: NUMBER
      - name: STDATE
        data_type: VARCHAR
