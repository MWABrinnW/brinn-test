version: 2
models:
  - name: bld_custodian_cash_balances
    data_tests:
      - compare_describe_to_prod:
          name: compare_describe_to_prod_bld_custodian_cash_balances
          state_database: edw
          state_schema: build
          state_name: bld_custodian_cash_balances
          summarize: false
          include_columns: [effective_date, account_number, total_value, cash_value, firm_source, custodian]
          exclude_columns: [_created_at, is_head, is_current, _source_loaded_at, _source_file]
          where_clause: effective_date >= current_date() - 7
          config:
            severity: warn
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          name: compare_row_count_bld_custodian_cash_balances
          config:
            severity: warn
            enabled: "{{ target.name != 'prod' }}"
          compare_model: edw.build.bld_custodian_cash_balances
          group_by: [effective_date, custodian]
          compare_group_by: [effective_date, custodian]
          row_condition: effective_date >= current_date() - 7
          compare_row_condition: effective_date >= current_date() - 7
    columns:
      - name: EFFECTIVE_DATE
        description: ''
        data_type: DATE
      - name: CUSTODIAN
        description: Custodian name, lower-case, no spaces.
        data_type: VARCHAR
      - name: FIRM
        description: Firm name
        data_type: VARCHAR
      - name: FIRM_SOURCE
        description: Firm entity associated with the link value.
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER
        description: End-client account number at Schwab.
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER_FORMATTED
        description: ''
        data_type: VARCHAR
      - name: TOTAL_CASH_VALUE
        description: ''
        data_type: NUMBER
      - name: MONEY_MARKET_VALUE
        description: ''
        data_type: NUMBER
      - name: OPTION_MARKET_VALUE
        description: ''
        data_type: NUMBER
      - name: MARGIN_EQUITY_VALUE
        description: ''
        data_type: NUMBER
      - name: IS_HEAD
        description: ''
        data_type: NUMBER
      - name: _SOURCE_FILE
        description: ''
        data_type: VARCHAR
      - name: _SOURCE_LOADED_AT
        description: Time when the records were created in the source table.
        data_type: TIMESTAMP_NTZ
      - name: RN_FIRM_SOURCE
        description: ''
        data_type: NUMBER
      - name: RN_GLOBAL
        description: ''
        data_type: NUMBER
      - name: _CREATED_AT
        description: ''
        data_type: TIMESTAMP_NTZ
