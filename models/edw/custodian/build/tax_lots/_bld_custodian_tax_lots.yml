version: 2
models:
  - name: bld_custodian_tax_lots
    data_tests:
      - compare_describe_to_prod:
          name: compare_describe_to_prod_bld_custodian_tax_lots
          state_database: edw
          state_schema: build
          state_name: bld_custodian_tax_lots
          summarize: false
          exclude_columns: [_created_at, is_head, is_current, _source_loaded_at, _source_file]
          where_clause: effective_date >= current_date() - 5
          config:
            severity: warn
            enabled: true
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          name: compare_row_count_bld_custodian_tax_lots
          config:
            severity: warn
            enabled: true
          compare_model: edw.build.bld_custodian_tax_lots
          group_by: [effective_date, custodian]
          compare_group_by: [effective_date, custodian]
          row_condition: effective_date >= current_date() - 7
          compare_row_condition: effective_date >= current_date() - 7
    columns:
