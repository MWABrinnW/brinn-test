version: 2
models:
  - name: custodian_accounts
    data_tests:
      - compare_describe_to_prod:
          name: compare_describe_to_prod_custodian_accounts
          state_database: edw
          state_schema: enterprise
          state_name: custodian_accounts
          summarize: false
          include_columns: [effective_date, account_number, total_value, cash_value, firm_source, custodian]
          exclude_columns: [_created_at, is_head, is_current, _source_loaded_at, _source_file]
          where_clause: effective_date >= current_date() - 7
          config:
            severity: warn
            enabled: true
    columns:
      - name: EFFECTIVE_DATE
        description: ''
        data_type: DATE
      - name: CUSTODIAN
        description: Custodian name, lower-case, no spaces.
        data_type: VARCHAR
      - name: FIRM
        description: Firm name
        data_type: VARCHAR
      - name: FIRM_SOURCE
        description: Firm entity associated with the link value.
        meta:
          row_access_policy: rap_firm_source
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER
        description: End-client account number at Schwab.
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER_FORMATTED
        description: ''
        data_type: VARCHAR
      - name: TOTAL_VALUE
        description: ''
        data_type: NUMBER
      - name: CASH_VALUE
        description: ''
        data_type: NUMBER
      - name: CUSTODIAN_LINK
        description: ''
        data_type: VARCHAR
      - name: CUSTODIAN_LINK_DETAIL
        description: ''
        data_type: VARCHAR
      - name: REP_LINK
        description: ''
