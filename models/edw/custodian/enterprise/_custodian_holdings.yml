version: 2
models:
  - name: custodian_holdings
    data_tests:
      - compare_describe_to_prod:
          name: compare_describe_to_prod_custodian_holdings
          state_database: edw
          state_schema: enterprise
          state_name: custodian_holdings
          summarize: false
          include_columns: [effective_date, account_number, symbol, is_cash, is_sweep, market_value, quantity,
            price, asset_class, asset_category]
          exclude_columns: [_created_at, is_head, is_current, _source_loaded_at, _source_file]
          where_clause: effective_date >= current_date() - 4
          config:
            severity: warn
            enabled: "{{ target.name != 'prod' }}"
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          name: compare_row_count_bld_custodian_holdings
          config:
            severity: warn
            enabled: "{{ target.name != 'prod' }}"
          compare_model: edw.build.bld_custodian_holdings
          group_by: [effective_date, custodian]
          compare_group_by: [effective_date, custodian]
          row_condition: effective_date >= current_date() - 7
          compare_row_condition: effective_date >= current_date() - 7
    columns:
      - name: EFFECTIVE_DATE
        description: ''
        data_type: DATE
      - name: CUSTODIAN
        description: Custodian name, lower-case, no spaces.
        data_type: VARCHAR
      - name: FIRM
        description: Firm name
        data_type: VARCHAR
      - name: FIRM_SOURCE
        description: Firm entity associated with the link value.
        meta:
          row_access_policy: rap_firm_source
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER
        description: End-client account number at Schwab.
        data_type: VARCHAR
      - name: ACCOUNT_NUMBER_FORMATTED
        description: ''
        data_type: VARCHAR
      - name: SYMBOL
        description: ''
        data_type: VARCHAR
      - name: TICKER
        description: ''
        data_type: VARCHAR
      - name: CUSIP
        description: CUSIP
        data_type: VARCHAR
      - name: SECURITY_NAME
        description: ''
        data_type: VARCHAR
      - name: SECURITY_TYPE
        description: |
          Identifies type of security:
          Fixed
          Deriv
          Eqty/MF
          Cash Eq
          Futures
          Forwards
          Index
          Option
          ST Debt
          If no data is available, the field will be blank.
        data_type: VARCHAR
      - name: SECURITY_NAME_SOURCE
        description: ''
        data_type: VARCHAR
      - name: IS_CASH
        description: ''
        data_type: NUMBER
      - name: IS_SWEEP
        description: ''
        data_type: NUMBER
      - name: MARKET_VALUE
        description: ''
        data_type: NUMBER
      - name: UNITS_SHARES
        description: ''
        data_type: NUMBER
      - name: QUANTITY
        description: ''
        data_type: NUMBER
      - name: QUANTITY_SETTLED
        description: Total number of settled shares
        data_type: NUMBER
      - name: QUANTITY_UNSETTLED
        description: ''
        data_type: NUMBER
      - name: PRICE
        description: ''
        data_type: NUMBER
      - name: PRICE_UNFACTORED
        description: ''
        data_type: NUMBER
      - name: FACTOR
        description: >-
          The security's current factor. For securities without a factor, the factor value will default
          to 1. Applies to TIPS, asset-backed securities, and other securities where a factor exists.
        data_type: NUMBER
      - name: COST_BASIS
        description: ''
        data_type: NUMBER
      - name: IS_13F
        description: ''
        data_type: NUMBER
      - name: ASSET_CATEGORY
        description: ''
        data_type: VARCHAR
      - name: ASSET_CLASS
        description: ''
        data_type: VARCHAR
      - name: CUSIP_SECURITY_TYPE
        description: ''
        data_type: VARCHAR
      - name: CUSIP_FUND_TYPE
        description: ''
        data_type: VARCHAR
      - name: CUSIP_INCOME_TYPE
        description: ''
        data_type: VARCHAR
      - name: UNDERLYING_TICKER
        description: ''
        data_type: VARCHAR
      - name: UNDERLYING_CUSIP
        description: CUSIP specific to the parent security.
        data_type: VARCHAR
      - name: UNDERLYING_SECURITY_ID_SOURCE
        description: ''
        data_type: VARCHAR
      - name: PRODUCT_TYPE
        description: ''
        data_type: VARCHAR
      - name: PRODUCT_TYPE_SOURCE_DEFINITION
        description: ''
        data_type: VARCHAR
      - name: PRODUCT_TYPE_SOURCE_CODE
        description: ''
        data_type: VARCHAR
      - name: ACCOUNT_TYPE
        description: >-
          Type of account (Brokerage, Schwab One, IRA, etc.) SCHWAB ONE, QUALIFIED RETIREMENT PLAN, BROKERAGE
        data_type: VARCHAR
      - name: ACCOUNT_TYPE_SOURCE
        description: ''
        data_type: VARCHAR
      - name: ACCOUNT_TYPE_SOURCE_CODE
        description: ''
