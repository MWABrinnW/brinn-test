        data_type: VARCHAR
      - name: SEDOL
        description: >-
          The Stock Exchange Daily Official List number; a code used by the London Stock Exchange to identify
          foreign stocks.
        data_type: VARCHAR
      - name: EXTRA_FIELDS
        description: ''
        data_type: OBJECT
      - name: RN_FIRM_SOURCE
        description: ''
        data_type: NUMBER
      - name: RN_GLOBAL
        description: ''
