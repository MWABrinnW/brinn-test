version: 2
models:
  - name: associates
    data_tests:
      - compare_describe_to_prod:
          name: compare_describe_to_prod_associates
          state_database: edw
          state_schema: enterprise
          state_name: associates
          summarize: False
          exclude_columns: ["_created_at", "is_head"]
          where_clause: None
          config:
            severity: warn
            enabled: "{{ target.name != 'prod' }}"
    columns:
      - name: ASSOCIATE_ID
        description: 'ADP system identifier, exists in Oracle HCM for legacy data reference.  Will be blank for new associates.'
        data_type: VARCHAR
      - name: LEGACY_EMPLOYEE_NUM
        description: ''
        data_type: VARCHAR
      - name: EMPLOYMENT_STATUS
        description: '"Active" or "Terminated"'
        data_type: VARCHAR
      - name: JOB_FUNCTION_NAME
        description: 'Name of the primary job function of the associate, for example: Benefits, Client Service, Compliance, Estate Planning, Finance, Insurance, Licensed Advisor, Platform Mangement, Portfolio Management, Team Operations, Trading, etc.'
        data_type: VARCHAR
      - name: JOB_FAMILY
        description: 'Wealth Management, Wealth Operations, Specialty Tax, Investments, Business Development, Business Intelligence, Human Resources, Information Technology, etc. Added to HCM field list on 5/24/2024'
        data_type: VARCHAR
      - name: WORK_FROM_HOME
        description: 'Flag that indicates remote work associate'
        data_type: VARCHAR
      - name: WORKPLACE
        description: 'Indicates the location where the associate works from: Hybrid, Onsite, Remote'
        data_type: VARCHAR
      - name: PERSON_SOURCE
        description: 'Person source from the Person profile (acquisition, lift-out, etc.)'
        data_type: VARCHAR
      - name: JOB_ID
        description: 'Job ID'
        data_type: VARCHAR
      - name: ASSOCIATE_LEGAL_NAME_FIRST
        description: 'First Name, Legal'
        data_type: VARCHAR
      - name: ASSOCIATE_LEGAL_NAME_MIDDLE
        description: 'Middle Name, legal'
        data_type: VARCHAR
      - name: ASSOCIATE_LEGAL_NAME_LAST
        description: 'Last Name, legal'
        data_type: VARCHAR
      - name: ASSOCIATE_LEGAL_NAME_FULL
        description: 'Full legal name: Last, First Middle'
        data_type: VARCHAR
      - name: ASSOCIATE_PREFERRED_NAME
        description: 'Preferred first name'
        data_type: VARCHAR
      - name: ASSOCIATE_LEGAL_NAME_SUFFIX
        description: 'Suffix, legal'
        data_type: VARCHAR
      - name: ASSOCIATE_WORK_EMAIL
        description: 'Associate work email address'
        data_type: VARCHAR
      - name: ASSOCIATE_WORK_PHONE
        description: 'Associate work phone number'
        data_type: VARCHAR
      - name: ASSOCIATE_WORK_CELL_PHONE
