version: 2
models:
  - name: edw__billing_wealth
    description: pass through view of billing_wealth from odw
    columns:
      - name: system_name
        description: >-
          Source system the revenue, billing data is derived from (ex. Orion, Salesforce, Black Diamond,
          etc.)
      - name: system_instance
        description: >-
          Which instance of the source system is the revenue data derived from?  Ex. MWA Orion, MPS Orion,
          AdvicePeriod Black Diamond, Houston Black Diamond, etc.)
      - name: system_key
        description: "Revenue source system: concat(system_name , '__' , system_instance)"
      - name: firm_source
        description: Firm entity associated with the link value.
        meta:
          row_access_policy: rap_firm_source
      - name: location_code
        description: >-
          Mariner Location Code associated with the Mariner Office/Accounting ID (at the time the invoice
          was generated).  This is the Location Code for the advisor office, which is where the revenue
          gets booked.
      - name: office_name
        description: >-
          Mariner Office Name associated with the Location Code (at the time the invoice was generated).  This
          is the Office Name for the advisor office, which is where the revenue gets booked.
      - name: client_location_code
        description: >-
          A client can be assigned to one Mariner Office while their client manager may be in another
          Mariner Office.  Revenue is booked to the office of the advisor.  Sourced from Compass for integrated
          locations, will likely be hard-coded for non-integrated locations.  This location code can be
          joined to Location Master to get additional information.
      - name: client_office_name
        description: >-
          A client can be assigned to one Mariner Office while their client manager may be in another
          Mariner Office.  Revenue is booked to the office of the advisor.  Client Location Code is sourced
          from Compass for integrated locations, will likely be hard-coded for non-integrated locations.  This
          field will pull in the associated client Office Name from Location Master.
      - name: invoice_created_at
        description: Date and time the invoice was generated/billed to the customer
      - name: invoice_date
        description: Date the invoice was generated/billed to the customer
      - name: revenue_period_end_date
        description: End date of invoiced service period, date grain dependent on billing frequency
      - name: revenue_quarter_end_date
        description: >-
          Quarter that the billed fees will be reported in.  Date format that represents the last calendar
          day of the quarter.
      - name: invoice_number_source
        description: >-
          Unique number for the invoice record from the source system.  For Salesforce Compass, this is
          the Billing Statement Name from the Invoice Review object (ex. BR - 2534831).  This will differ
          from the Oracle invoice number.
      - name: billing_statement_id_source
        description: >-
          Orion invoice number (for Salesforce records), internal billing statement ID for other systems
          (if available)
      - name: billing_statement_id_crm
        description: >-
          This will hold the 18-digit ID on the Invoice Review object in Salesforce Compass.  This information
          is only available on Compass billing records.
      - name: invoice_status
        description: >-
          Status of the invoice (ex. Approved by Advisor, Fee Collected / Complete, Rejected, Fee Uncollectible
          - Written Off, etc.)
      - name: is_intra_period_invoice
        description: Indicates if this invoice was created in the middle of a billing cycle
      - name: account_number
        description: Financial account number excluding leading zeroes or hyphens within the number
      - name: account_number_formatted
        description: >-
          Financial account number that would be expected at the custodian (includes hyphens, leading
          zeroes, etc.).
      - name: billing_account_number
        description: Financial account number paying the fee
      - name: account_id_pms
        description: >-
          Internal number or identifier for the account from the source system (Orion Account ID, Hidden
          Portfolio Code, etc.)
      - name: registrant_name
        description: Name of the primary client associated with the financial account
      - name: account_name
        description: Financial account name from the external system
      - name: type_of_account
        description: Type of financial account
      - name: client_id_pms
        description: >-
          Internal number or identifier from the PMS or billing system associated with the household name
          (ex. Orion Household ID)
      - name: aum_classification_status
        description: AUM classification or management identifier of the financial account
      - name: model_investment_strategy
        description: Model name that the financial account is invested in
      - name: model_grouping_assignment
        description: ''
      - name: custodian
        description: Custodian holding the financial account assets / funds
      - name: billing_custodian
        description: >-
          Custodian where the Billing Account is held, which is the client financial account where the
          fees are paid from.
      - name: partner_firm
        description: >-
          Current Partner Firm assignment of client. This is a Salesforce Compass field present on the
          Billing Statement/Invoice Review object.  Needed for GL roll-up.
      - name: partner_firm_original
        description: >-
          Branch/Partner at the time of the bill generation, sourced from Salesforce Compass, Billing
          Statement - Original Partner Firm.
      - name: advisor_source
        description: ''
      - name: advisor_original
        description: ''
      - name: associate_id_original
        description: ''
      - name: advisor_primary
        description: ''
      - name: associate_id_primary
        description: ''
      - name: advisor_type
        description: ''
      - name: advisor
        description: ''
      - name: associate_id
        description: Employee number/ID for the client manager (ex. 000615)
      - name: fee_type
        description: Type of fee this record represents
      - name: fee_schedule_source
        description: >-
          Rate(s) in which the account is billed.  This is the raw fee schedule value pulled from the
          source system.
      - name: assets_as_of_date
        description: Date billable assets based on
      - name: fee_calculation_date
        description: Date fees were calculated
      - name: effective_fee_rate
        description: Fee rate percentage calculated using billable value, annualized
      - name: total_account_value
        description: Total account value, pulled from the invoice information
      - name: billable_value
        description: Value of the financial account in which the fee is calculated on
      - name: fee_excluded_assets
        description: Value of the financial account which is non-billable
      - name: client_fee_gross
        description: Gross flat fee or fee calculated on billable value before any adjustments
      - name: client_fee_rebates
        description: Any 40Act or NTF rebates applied to the account per ERISA
      - name: client_net_contribution_fee
        description: >-
          Net charge or rebate to the client if contributions & distributions meet certain criteria, or
          new accounts, or accounts with flows of $100K or more
      - name: client_adjustments_fee
        description: Any other miscellaneous credits or debits to the fee
      - name: client_write_off_fee
        description: The value of the fee that has been written off for various reasons
      - name: client_fee_net
        description: The actual fee to be collected from the account
      - name: referral_fee
        description: ''
      - name: collection_date
        description: Date in which the fee was actually collected
      - name: third_party_calculation
        description: Indicates if a 3rd party calculation was applied
      - name: billing_style
        description: Denotes whether the account is billed in arrears or advance
      - name: billing_frequency
        description: How frequent the client is billed (quarterly, monthly, etc.)
      - name: billing_method
        description: Billing method for the invoice, ex. Automatic Deduction, Invoiced, Direct, Indirect
      - name: bill_on_balance_type
        description: >-
          What is the type of account balance used for generating the invoice (ex. average daily balance,
          end of month, etc.).
      - name: payment_terms
        description: Payment terms for this invoice, needed for cash application
      - name: payment_method_fee
        description: Tracks Advice Pay fees associated with billing
      - name: account_class
        description: >-
          Valid values are: REV | Revenue (Wealth); FREIGHT | Freight; TAX | Tax; REC | Receivables; CHARGES
          | Late Charges; UNBILL | Unbilled Receivables; UNEARN | Unearned Revenue
      - name: recurring_revenue
        description: Indicates if this revenue is expected to be recurring (True/False)
      - name: impacted_by_financial_markets
        description: Indicates if the fee is impacted by changes in AUM value (True/False)
      - name: coa_segment_1_legal_entity_id
        description: Legal ID portion of account number
      - name: coa_segment_2_product_id
        description: Product ID portion of account number
      - name: coa_segment_3_accounting_id
        description: >-
          Accounting ID that corresponds 1:1 with a location code.  This is the Accounting ID for the
          office of the advisor, which is where revenue gets booked.
      - name: coa_segment_4_team_id
        description: Team ID portion of account number
      - name: coa_segment_5_natural_account_id
        description: Natural Account ID portion of account number
      - name: coa_segment_6_initiative_id
        description: Initiative ID portion of account number, new segment
      - name: coa_segment_7_intercompany_id
        description: Intercompany ID portion of account number
      - name: coa_segment_8_future_id
        description: Future ID portion of account number, new segment
      - name: coa_account_number
        description: >-
          Full GL account number (segments concatenated): [Legal Entity]-[Product]-[Accounting ID]-[Team]-[Natural
          Account]-[Initiative]-[Intercompany]-[Future]
      - name: revenue_category
        description: Business line category in which the revenue is attributed to
      - name: revenue_type
        description: Type of revenue, derived field based on Fee Type.  Important for the GL.
      - name: system_name_crm
        description: >-
          Source system the CRM/client data is sourced or derived from (ex. Salesforce, Elements, Redtail,
          etc.)
      - name: system_instance_crm
        description: >-
          Which instance of the CRM source system is the client data sourced/derived from?  Ex. Salesforce
          Compass, Advice Period Elements, etc.
      - name: system_key_crm
        description: "CRM source system: concat(system_name_crm , '__' , system_instance_crm)"
      - name: account_id_crm
        description: >-
          Unique identifier that ties the financial account to the respective CRM (for example, Salesforce
          18 digit id for the Estate Item: a0B3c00000iMW64EAG)
      - name: client_id_crm
        description: >-
          Unique identifier that ties the household to the respective CRM (for example, Salesforce 18
          digit id, sample: 0013c000020nOsJAAU, client/household identifier for other systems)
      - name: client_id_original_crm
        description: >-
          Original (when billing statement was created) unique identifier that ties the household to the
          respective CRM (for example, Salesforce 18 digit id, sample: 0013c000020nOsJAAU)
      - name: client_id_unique_compass
        description: >-
          Client/Household unique identifier that ties the household to Salesforce Compass (Unique ID,
          sample: A-00251583)
      - name: client_name
        description: Name of the client/household the financial account is a part of
      - name: client_name_original_crm
        description: Original (when Billing Statement was created) Client/Household name
      - name: client_lead_source
        description: Lead Source for the client.  Required to determine natural account.
      - name: client_key_tags_crm
        description: >-
          Tags on the Client object in Salesforce Compass.  A client can have 1 or more tags, selected
          from a drop-down list.
      - name: transaction_type
        description: Invoice or Return.  Required field for Oracle.
      - name: transaction_line_type
        description: Line, Tax, Freight and Charges (value is Line for Wealth revenue)
      - name: transaction_line_quantity
        description: Default to 1 for all transactions, required field for Oracle.
      - name: currency_code
        description: USD for all transactions, required field for Oracle.
      - name: currency_conversion_type
        description: User for all transactions, required field for Oracle.
      - name: unit_selling_price
        description: Default to Net Revenue for all transactions, required field for Oracle.
      - name: excluded_reasons
        description: ''
      - name: is_excluded
        description: >-
          Indicates if this billing record should be excluded when sent to the general ledger in Oracle.
      - name: _invoice_key
        description: System_Key + Invoice Date + Invoice Number Source
      - name: _source_loaded_at
        description: Time when the records were created in the source table.
      - name: _source_file
        description: >-
          Helps identify where this record originated from (database schema and table, or source file
          name when data not available in SNF)
      - name: _box_file_id
        description: Box file identifier in the source table
      - name: _extra_fields
        description: ''
      - name: _created_at
        description: DateTime in which the record was loaded to the table
      - name: is_legacy
        description: >-
          Indicates if this billing record is sourced from legacy Revenue Master (EDW.vw.revenue_billing)
          for dates older than 2024 (1=true, 0=false). NOTE: Legacy billing records do not fully follow
          the normalization and/or business logic of our mastered Rev360 sources, but do allow for basic
          aggregation of revenue history for 2022 and 2023.
