version: 2

seeds:
  - name: market_holidays
    description: '{{ doc("holidays_description") }}'
    docs:
      show: true
    config:
      enabled: true
      grants:
        select: "{{ ['datamanagement', 'engineering'] if target.name in ['prod', 'test', 'ci'] else []}}"
    columns:
      - name: market_holiday
        data_tests:
          - not_null
          - unique