version: 2

seeds:
  - name: custodian_mappings
    description: Mapping file used to decode or normalize values from custodian files
    docs:
      show: true
    config:
      enabled: true
      tags: ['custodial', 'custodian']
      grants:
        select: "{{ ['db_edw_general_mwa_r'] if target.name in ['prod','test'] else []}}"
    tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          column_list: ["custodian", "field", "source"]
          quote_columns: false
    column_types:
      custodian: varchar(100)
      field: varchar(100)
      source: varchar(500)
      definition: varchar(500)
      normalized: varchar(500)
    columns:
      - name: custodian
        description: "Custodian key value"
        tests:
          - not_null
          - accepted_values:
              values: ['schwab', 'fidelity', 'tda', 'pershing', 'lpl']
      - name: field
        description: "The field the contains the values we are evaluating or joining on"
        tests:
          - not_null
          - accepted_values:
              values: ['account_registration', 'restriction', 'cost_basis', 'account_type', 'security_type_description']
      - name: source
        description: "Original value as represented in the source data"
      - name: definition
        description: "Definition or decoded value of the source value"
        tests:
          - not_null
      - name: normalized
        description: "Business value the source value should map to"
