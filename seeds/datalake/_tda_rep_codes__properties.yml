version: 2

seeds:
  - name: tda_rep_codes
    description: TDA rep code to firm mapping file.
    docs:
      show: true
    config:
      enabled: true
      tags: ['custodial', 'custodian', 'tda']
      schema: tda
      grants:
        select: "{{ ['db_custodial_r'] if target.name in ['prod', 'test', 'ci'] else []}}"
    columns:
      - name: rep_code
        description: "TDA rep code"
        data_tests:
          - not_null
          - unique
      - name: firm
        description: "Firm name"