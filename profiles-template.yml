default:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: mariner.us-east-2.privatelink
      authenticator: externalbrowser

      user: "{{ env_var('username') }}"
      database: dbt
      warehouse: wh_dbt
      schema: "dbt_{{ env_var('username') }}"
      role: engineering
      threads: 5
      client_session_keep_alive: False

      # optional
      connect_retries: 0
      connect_timeout: 10
      retry_on_database_errors: False
      retry_all: False
